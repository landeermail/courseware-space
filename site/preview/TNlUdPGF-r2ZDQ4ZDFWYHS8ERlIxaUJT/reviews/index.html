<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex,nofollow,noarchive">
  <meta name="referrer" content="no-referrer">
  <meta name="courseware-api-base" content="https://coursewenerator-zuhffdutvy.cn-hangzhou.fcapp.run">
  <link rel="icon" href="data:,">
  <title>我的评价</title>
  <style>
    :root{--ink:#172033;--muted:#647084;--line:#d9e2ee;--surface:#fff;--soft:#f4f7fb;--blue:#2459d3;--blue-soft:#edf3ff;--green:#087a55;--green-soft:#e8f7f1;--amber:#9a5700;--amber-soft:#fff6e5;--red:#b42318;--shadow:0 14px 38px rgba(23,32,51,.08)}
    *{box-sizing:border-box}body{margin:0;color:var(--ink);background:linear-gradient(180deg,#f7faff 0,#eef3f9 100%);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;line-height:1.55}
    a{color:inherit}button,a{font:inherit;-webkit-tap-highlight-color:transparent}.page{width:min(960px,calc(100% - 32px));margin:0 auto;padding:42px 0 64px}
    .hero{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:28px;align-items:end;margin-bottom:28px}.eyebrow{margin:0 0 8px;color:var(--blue);font-size:13px;font-weight:750;letter-spacing:.08em}.hero h1{margin:0;font-size:clamp(30px,4vw,44px);line-height:1.12;letter-spacing:-.03em}.lead{max-width:680px;margin:12px 0 0;color:var(--muted);font-size:16px}.back-link{display:inline-flex;min-height:44px;align-items:center;padding:9px 16px;border:1px solid #b7caf3;border-radius:11px;color:var(--blue);background:#fff;font-weight:750;text-decoration:none;white-space:nowrap}.back-link:focus-visible,.card-actions a:focus-visible,.card-actions button:focus-visible{outline:3px solid rgba(36,89,211,.24);outline-offset:3px}
    .notice{margin:0 0 20px;padding:12px 14px;border:1px solid #efb083;border-radius:12px;color:#7a3b00;background:#fff6ed}.notice[hidden]{display:none}
    .section{margin-top:30px}.section h2{margin:0 0 4px;font-size:23px}.section-copy{margin:0 0 14px;color:var(--muted);font-size:14px}
    .task-list{display:grid;gap:14px}.task-card{padding:20px;border:1px solid var(--line);border-radius:16px;background:var(--surface);box-shadow:0 8px 24px rgba(23,32,51,.05)}.task-card.pending{border-color:#b7caf3;background:linear-gradient(135deg,#fff,#edf3ff)}
    .task-head{display:flex;justify-content:space-between;gap:12px;align-items:flex-start}.task-head h3{margin:0;font-size:19px}.status{display:inline-flex;align-items:center;min-height:28px;padding:4px 9px;border-radius:999px;font-size:12px;font-weight:750;white-space:nowrap}.status.pending{color:var(--amber);background:var(--amber-soft)}.status.reviewed{color:var(--green);background:var(--green-soft)}
    .task-meta{margin:8px 0 0;color:var(--muted);font-size:13px}.task-meta span{display:inline-block;margin-right:14px}
    .card-actions{display:flex;flex-wrap:wrap;gap:10px;margin-top:14px}.btn{display:inline-flex;min-height:46px;align-items:center;justify-content:center;padding:9px 16px;border:1px solid #aebacc;border-radius:11px;color:var(--ink);background:#fff;font-weight:750;text-decoration:none;cursor:pointer;white-space:nowrap}.btn.primary{border-color:var(--blue);color:#fff;background:var(--blue)}
    .history{margin-top:14px;border-top:1px dashed var(--line);padding-top:14px;display:grid;gap:12px}.history[hidden]{display:none}
    .version{padding:14px 16px;border:1px solid var(--line);border-radius:12px;background:var(--soft)}.version.current{border-color:#9fc1a9;background:var(--green-soft)}
    .version-head{display:flex;justify-content:space-between;gap:10px;align-items:baseline;flex-wrap:wrap}.version-head strong{font-size:14px}.version-tag{padding:2px 8px;border-radius:999px;font-size:12px;font-weight:750;color:var(--green);background:#fff;border:1px solid #9fc1a9}.version-time{color:var(--muted);font-size:13px}
    .version-body{margin:8px 0 0;font-size:13px;color:#3c4a5e}.version-body p{margin:4px 0}.dim-line{color:var(--muted)}
    .empty{padding:18px;border:1px dashed #b8c5d5;border-radius:14px;color:var(--muted);background:rgba(255,255,255,.7)}
    footer{margin-top:42px;padding-top:18px;border-top:1px solid var(--line);color:var(--muted);font-size:13px}
    @media(max-width:760px){.page{width:min(100% - 24px,620px);padding-top:26px}.hero{grid-template-columns:1fr}}
  </style>
</head>
<body>
  <main class="page">
    <header class="hero">
      <div><p class="eyebrow">物理互动课件 · 专属入口</p><h1>我的评价</h1><p class="lead">这里列出您的全部评价任务：待完成的可以直接进入评价，已完成的可以修改或回看历史版本。</p></div>
      <a class="back-link" href="../">返回课件列表</a>
    </header>
    <p class="notice" id="notice" hidden></p>

    <section class="section" aria-labelledby="pendingTitle">
      <h2 id="pendingTitle">待评价</h2>
      <p class="section-copy">先完整体验课件，再填写六维评价。</p>
      <div class="task-list" id="pendingList"><div class="empty">正在读取评价任务…</div></div>
    </section>

    <section class="section" aria-labelledby="reviewedTitle">
      <h2 id="reviewedTitle">已完成评价</h2>
      <p class="section-copy">每次修改都会保留为新版本，历史版本只读。</p>
      <div class="task-list" id="reviewedList"></div>
    </section>
    <footer>评价记录保存在服务端，仅用于改进课件，不关联姓名、学校或其他身份信息。</footer>
  </main>
  <script>
  (()=>{
    'use strict';
    const ACCESS_KEY='coursewareAccessCode';
    const configuredApiBase=document.querySelector('meta[name="courseware-api-base"]').content.replace(/\/$/,'');
    const isLocalPreview=['localhost','127.0.0.1','[::1]'].includes(location.hostname);
    const API_BASE=isLocalPreview?'':configuredApiBase;
    const notice=document.getElementById('notice');
    const pendingList=document.getElementById('pendingList');
    const reviewedList=document.getElementById('reviewedList');
    const fragment=new URLSearchParams(location.hash.slice(1));
    const fragmentCode=fragment.get('access');
    if(fragmentCode){sessionStorage.setItem(ACCESS_KEY,fragmentCode);history.replaceState(null,'',location.pathname+location.search)}
    const esc=value=>String(value).replace(/[&<>"']/g,ch=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[ch]));
    const DIMENSION_LABELS={causal_presentation:'因果呈现',process_visibility:'过程可见',effective_interaction:'有效交互',task_driven:'任务驱动',verifiability:'可验证性',exam_connection:'与解题的衔接'};
    const formatTime=value=>{
      const time=new Date(value);
      return Number.isNaN(time.getTime())?String(value||''):time.toLocaleString('zh-CN',{hour12:false});
    };
    function showNotice(message){notice.textContent=message;notice.hidden=false;}
    function versionHtml(version,currentId){
      const current=version.feedback_id===currentId;
      const overall=version.overall||{};
      const verdict=overall.verdict==='satisfied'?'整体满意':overall.verdict==='reject'?'打回修改':'—';
      const dims=Object.keys(DIMENSION_LABELS).map(key=>{
        const item=(version.dimensions||{})[key]||{};
        const text=item.verdict==='pass'?'过':item.verdict==='fail'?'不过':'—';
        return `${DIMENSION_LABELS[key]}：${text}`;
      }).join('；');
      const reasons=Array.isArray(overall.rejection_reasons)&&overall.rejection_reasons.length?`<p>打回原因：${overall.rejection_reasons.map(reason=>esc(DIMENSION_LABELS[reason]||{usability:'操作可用性',information_overload:'信息过载',other:'其他'}[reason]||reason)).join('、')}</p>`:'';
      const note=overall.note?`<p>整体备注：${esc(overall.note)}</p>`:'';
      return `<article class="version${current?' current':''}"><div class="version-head"><strong>${current?'<span class="version-tag">当前版本</span> ':''}评价版本</strong><span class="version-time">${esc(formatTime(version.reviewed_at))}</span></div><div class="version-body"><p>整体结论：${verdict}</p><p class="dim-line">${esc(dims)}</p>${reasons}${note}</div></article>`;
    }
    function taskCard(task,reviewed){
      const feedbackUrl=`../feedback/?task_id=${encodeURIComponent(task.task_id)}`;
      const tryUrl=`../${task.courseware_url}`;
      const meta=[`<span>精确 revision：${esc(task.revision_id)}</span>`];
      let actions='';
      let historyHtml='';
      if(reviewed){
        const current=task.current_feedback||{};
        meta.push(`<span>当前评价时间：${esc(formatTime(current.reviewed_at))}</span>`);
        actions=`<a class="btn primary" href="${feedbackUrl}">修改评价</a><a class="btn" href="${tryUrl}">再次体验课件</a><button class="btn" type="button" data-history="${esc(task.task_id)}">查看历史</button>`;
        const history=Array.isArray(task.feedback_history)?task.feedback_history:[];
        historyHtml=`<div class="history" id="history-${esc(task.task_id)}" hidden>${history.map(version=>versionHtml(version,current.feedback_id)).join('')}</div>`;
      }else{
        meta.push(`<span>分派时间：${esc(formatTime(task.assigned_at))}</span>`);
        actions=`<a class="btn" href="${tryUrl}">先体验课件</a><a class="btn primary" href="${feedbackUrl}">填写评价</a>`;
      }
      return `<article class="task-card${reviewed?'':' pending'}"><div class="task-head"><h3>${esc(task.title)}</h3><span class="status ${reviewed?'reviewed':'pending'}">${reviewed?'已评价':'待评价'}</span></div><p class="task-meta">${meta.join('')}</p><div class="card-actions">${actions}</div>${historyHtml}</article>`;
    }
    function render(tasks){
      const pending=tasks.filter(task=>task.status!=='reviewed');
      const reviewed=tasks.filter(task=>task.status==='reviewed');
      pendingList.innerHTML=pending.length?pending.map(task=>taskCard(task,false)).join(''):'<div class="empty">目前没有待评价的课件。</div>';
      reviewedList.innerHTML=reviewed.length?reviewed.map(task=>taskCard(task,true)).join(''):'<div class="empty">还没有已完成的评价。</div>';
      reviewedList.querySelectorAll('[data-history]').forEach(button=>button.addEventListener('click',()=>{
        const panel=document.getElementById(`history-${button.dataset.history}`);
        if(!panel)return;
        panel.hidden=!panel.hidden;
        button.textContent=panel.hidden?'查看历史':'收起历史';
      }));
    }
    const accessCode=sessionStorage.getItem(ACCESS_KEY);
    if(!accessCode){
      pendingList.innerHTML='<div class="empty">无法读取评价任务。</div>';
      reviewedList.innerHTML='';
      showNotice('此页面需要从完整的专属链接进入，请回到收到的原链接重新打开。');
      return;
    }
    fetch(`${API_BASE}/api/reviews`,{headers:{'X-Courseware-Access-Code':accessCode}})
      .then(response=>{
        if(response.status===403)throw new Error('个人链接无效或没有评价任务，请从完整专属链接进入。');
        if(!response.ok)throw new Error('评价状态暂时无法读取，请稍后刷新重试。');
        return response.json();
      })
      .then(data=>{
        const tasks=Array.isArray(data.tasks)?data.tasks:[];
        if(!tasks.length){
          pendingList.innerHTML='<div class="empty">目前没有待评价的课件。</div>';
          reviewedList.innerHTML='<div class="empty">还没有已完成的评价。</div>';
          return;
        }
        render(tasks);
      })
      .catch(error=>{
        pendingList.innerHTML='<div class="empty">无法读取评价任务。</div>';
        reviewedList.innerHTML='';
        showNotice(error instanceof Error?error.message:'评价状态暂时无法读取，请稍后刷新重试。');
      });
  })();
  </script>
</body>
</html>
