<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light">
  <title>匀强磁场中的滑动导体杆：向右切割</title>
  <style>
    :root {
      --ink: #172033;
      --muted: #667085;
      --line: #d7deea;
      --surface: #ffffff;
      --soft: #f4f7fb;
      --field: #eef2ff;
      --blue: #2563eb;
      --blue-soft: #dbeafe;
      --red: #dc2626;
      --amber: #b45309;
      --green: #047857;
      --shadow: 0 12px 32px rgba(33, 45, 72, .09);
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      color: var(--ink);
      background: #f8fafc;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
      line-height: 1.55;
    }

    button, input { font: inherit; }

    button:focus-visible, input:focus-visible {
      outline: 3px solid rgba(37, 99, 235, .32);
      outline-offset: 2px;
    }

    .page {
      width: min(1180px, calc(100% - 32px));
      margin: 0 auto;
      padding: 24px 0 40px;
    }

    .hero {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 20px;
      margin-bottom: 16px;
    }

    h1 {
      margin: 0;
      font-size: clamp(24px, 3vw, 36px);
      line-height: 1.25;
    }

    .subtitle {
      margin: 6px 0 0;
      color: var(--muted);
      font-size: 15px;
    }

    .scope {
      flex: 0 0 auto;
      padding: 7px 11px;
      border: 1px solid #b7c6e5;
      border-radius: 999px;
      color: #1d4ed8;
      background: #eff6ff;
      font-size: 13px;
      font-weight: 700;
    }

    .question {
      margin: 0 0 16px;
      padding: 14px 16px;
      border-left: 4px solid var(--blue);
      border-radius: 8px;
      background: var(--surface);
      box-shadow: var(--shadow);
    }

    .workbench {
      display: grid;
      grid-template-columns: minmax(0, 1.6fr) minmax(300px, .9fr);
      gap: 16px;
      align-items: stretch;
    }

    .scene-card, .reasoning {
      border: 1px solid var(--line);
      border-radius: 16px;
      background: var(--surface);
      box-shadow: var(--shadow);
    }

    .scene-card { overflow: hidden; }

    .scene-head {
      display: flex;
      justify-content: space-between;
      gap: 14px;
      align-items: center;
      padding: 12px 16px;
      border-bottom: 1px solid var(--line);
    }

    .scene-head strong { font-size: 16px; }
    .scene-head span { color: var(--muted); font-size: 13px; }

    .scene-wrap {
      min-height: 360px;
      padding: 4px 10px 0;
      background: linear-gradient(180deg, #fff 0%, #fbfcff 100%);
    }

    #scene {
      display: block;
      width: 100%;
      height: auto;
      max-height: 430px;
      touch-action: none;
    }

    .rail { stroke: #344054; stroke-width: 7; stroke-linecap: round; }
    .wire { fill: none; stroke: #475467; stroke-width: 5; stroke-linejoin: round; }
    .rod { stroke: #172033; stroke-width: 13; stroke-linecap: round; }
    .field-mark { fill: #64748b; font-size: 25px; font-weight: 700; text-anchor: middle; }
    .endpoint { fill: #172033; font-size: 21px; font-weight: 800; }
    .scene-label { fill: #475467; font-size: 17px; font-weight: 700; }
    .motion-arrow { stroke: var(--blue); stroke-width: 7; stroke-linecap: round; }
    .force-arrow { stroke: var(--red); stroke-width: 6; stroke-linecap: round; }
    .current-arrow { stroke: var(--amber); stroke-width: 6; stroke-linecap: round; }
    .dimension { stroke: #98a2b3; stroke-width: 2; }

    .controls {
      display: grid;
      gap: 12px;
      padding: 14px 16px 16px;
      border-top: 1px solid var(--line);
      background: var(--soft);
    }

    .control-row {
      display: flex;
      align-items: center;
      gap: 10px;
      flex-wrap: wrap;
    }

    .control-row label {
      min-width: 112px;
      color: #344054;
      font-size: 14px;
      font-weight: 700;
    }

    input[type="range"] {
      flex: 1 1 210px;
      min-width: 150px;
      accent-color: var(--blue);
    }

    .button-group {
      display: inline-flex;
      gap: 6px;
      flex-wrap: wrap;
    }

    button {
      min-height: 44px;
      padding: 8px 14px;
      border: 1px solid #c9d2e3;
      border-radius: 10px;
      color: #344054;
      background: #fff;
      cursor: pointer;
      font-weight: 700;
    }

    button:hover { background: #f8fafc; }

    button[aria-pressed="true"], .primary {
      border-color: var(--blue);
      color: #fff;
      background: var(--blue);
    }

    button[aria-pressed="true"]:hover, .primary:hover { background: #1d4ed8; }

    .readout {
      min-width: 92px;
      color: var(--blue);
      font-variant-numeric: tabular-nums;
      font-weight: 800;
    }

    .reasoning {
      display: flex;
      flex-direction: column;
      padding: 16px;
    }

    .reasoning h2 {
      margin: 0 0 12px;
      font-size: 19px;
    }

    .causal-chain {
      display: grid;
      gap: 7px;
      margin-bottom: 14px;
    }

    .causal-step {
      display: grid;
      grid-template-columns: 28px 1fr;
      gap: 9px;
      align-items: start;
      padding: 9px 10px;
      border-radius: 10px;
      background: var(--soft);
    }

    .causal-step b {
      display: grid;
      place-items: center;
      width: 28px;
      height: 28px;
      border-radius: 50%;
      color: #fff;
      background: #344054;
    }

    .causal-step strong { display: block; font-size: 14px; }
    .causal-step span { color: var(--muted); font-size: 13px; }

    .metrics {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 8px;
      margin-top: auto;
    }

    .metric {
      min-width: 0;
      padding: 9px 10px;
      border: 1px solid var(--line);
      border-radius: 10px;
    }

    .metric span { display: block; color: var(--muted); font-size: 12px; }
    .metric strong { display: block; margin-top: 2px; font-size: 18px; font-variant-numeric: tabular-nums; }

    .formula {
      margin-top: 12px;
      padding: 10px 12px;
      border-radius: 10px;
      color: #23304b;
      background: #eef4ff;
      font-family: "SFMono-Regular", Consolas, monospace;
      font-size: 13px;
      overflow-wrap: anywhere;
    }

    .conclusion {
      margin-top: 12px;
      padding: 11px 12px;
      border: 1px solid #a7d7c3;
      border-radius: 10px;
      color: #065f46;
      background: #ecfdf5;
      font-size: 14px;
      font-weight: 700;
    }

    .error {
      display: none;
      margin-bottom: 16px;
      padding: 14px;
      border: 2px solid #ef4444;
      border-radius: 10px;
      color: #991b1b;
      background: #fef2f2;
      font-weight: 700;
    }

    @media (max-width: 860px) {
      .workbench { grid-template-columns: 1fr; }
      .scene-wrap { min-height: 300px; }
      .reasoning { min-height: 0; }
    }

    @media (max-width: 560px) {
      .page { width: min(100% - 20px, 1180px); padding-top: 12px; }
      .hero { display: block; }
      .scope { display: inline-block; margin-top: 10px; }
      .scene-head { align-items: flex-start; flex-direction: column; gap: 2px; }
      .scene-wrap { min-height: 220px; padding-inline: 0; }
      .control-row { align-items: flex-start; }
      .control-row label { width: 100%; }
      .button-group { width: 100%; }
      .button-group button { flex: 1 1 120px; }
      .metrics { grid-template-columns: 1fr 1fr; }
    }

    @media (prefers-reduced-motion: reduce) {
      * { scroll-behavior: auto !important; }
    }
  </style>
</head>
<body>
  <main class="page">
    <header class="hero">
      <div>
        <h1 id="pageTitle"></h1>
        <p class="subtitle">拖动时间与速度，观察“运动 → 电流 → 安培力 → 能量”的同步变化。</p>
      </div>
      <span class="scope">匀强磁场 · 平动直杆</span>
    </header>

    <p class="question" id="sourceText"></p>
    <div class="error" id="errorBox" role="alert"></div>

    <section class="workbench" aria-label="滑动导体杆互动模型">
      <article class="scene-card">
        <div class="scene-head">
          <strong>导轨俯视图</strong>
          <span id="sceneStatus">物理时间 t = 0.00 s</span>
        </div>
        <div class="scene-wrap">
          <svg id="scene" viewBox="0 0 760 410" role="img" aria-labelledby="sceneTitle sceneDesc">
            <title id="sceneTitle">匀强磁场中的滑动导体杆</title>
            <desc id="sceneDesc"></desc>
            <defs>
              <marker id="arrowBlue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 Z" fill="#2563eb"/></marker>
              <marker id="arrowRed" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 Z" fill="#dc2626"/></marker>
              <marker id="arrowAmber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 Z" fill="#b45309"/></marker>
            </defs>
            <rect x="130" y="62" width="560" height="260" rx="12" fill="#eef2ff"/>
            <g id="fieldMarks" aria-hidden="true"></g>
            <path class="wire" d="M145 105 H92 V145 M92 245 V285 H145"/>
            <rect x="76" y="145" width="32" height="100" rx="9" fill="#fff" stroke="#475467" stroke-width="5"/>
            <text x="53" y="201" class="scene-label">R</text>
            <line x1="145" y1="105" x2="700" y2="105" class="rail"/>
            <line x1="145" y1="285" x2="700" y2="285" class="rail"/>
            <text x="112" y="100" class="endpoint">M</text>
            <text x="112" y="314" class="endpoint">N</text>
            <g id="rodGroup">
              <line x1="0" y1="105" x2="0" y2="285" class="rod"/>
              <text x="14" y="98" class="endpoint">c</text>
              <text x="14" y="316" class="endpoint">d</text>
              <line id="currentArrow" x1="0" y1="265" x2="0" y2="126" class="current-arrow" marker-end="url(#arrowAmber)"/>
              <text id="currentLabel" x="18" y="205" class="scene-label" fill="#b45309">I</text>
            </g>
            <g id="motionGroup">
              <line id="motionArrow" y1="52" y2="52" class="motion-arrow" marker-end="url(#arrowBlue)"/>
              <text id="motionLabel" y="37" class="scene-label" fill="#2563eb" text-anchor="middle">v</text>
            </g>
            <g id="forceGroup">
              <line id="forceArrow" y1="350" y2="350" class="force-arrow" marker-end="url(#arrowRed)"/>
              <text id="forceLabel" y="378" class="scene-label" fill="#dc2626" text-anchor="middle">F安</text>
            </g>
            <line x1="714" y1="105" x2="714" y2="285" class="dimension"/>
            <line x1="706" y1="105" x2="722" y2="105" class="dimension"/>
            <line x1="706" y1="285" x2="722" y2="285" class="dimension"/>
            <text id="lengthLabel" x="730" y="201" class="scene-label" text-anchor="end">L</text>
            <text id="fieldLabel" x="410" y="318" class="scene-label" text-anchor="middle">B</text>
          </svg>
        </div>

        <div class="controls">
          <div class="control-row">
            <button class="primary" id="playButton" type="button">播放慢放</button>
            <label for="timeRange">物理时间</label>
            <input id="timeRange" type="range" min="0" step="0.01" value="0">
            <output class="readout" id="timeValue" for="timeRange">0.00 s</output>
          </div>
          <div class="control-row">
            <label for="speedRange">速度比较</label>
            <input id="speedRange" type="range" min="0.25" max="2" step="0.05" value="1">
            <output class="readout" id="speedValue" for="speedRange"></output>
          </div>
          <div class="control-row">
            <label>方向比较</label>
            <div class="button-group" aria-label="运动方向">
              <button type="button" data-motion="right">杆向右</button>
              <button type="button" data-motion="left">杆向左</button>
            </div>
            <div class="button-group" aria-label="磁场方向">
              <button type="button" data-field="into_page">B 向里 ×</button>
              <button type="button" data-field="out_of_page">B 向外 •</button>
            </div>
            <button id="resetButton" type="button">恢复题设</button>
          </div>
        </div>
      </article>

      <aside class="reasoning" aria-live="polite">
        <h2>当前因果链</h2>
        <div class="causal-chain">
          <div class="causal-step"><b>1</b><div><strong id="causeMotion"></strong><span id="causeFlux"></span></div></div>
          <div class="causal-step"><b>2</b><div><strong id="causeLenz"></strong><span id="causeCurrent"></span></div></div>
          <div class="causal-step"><b>3</b><div><strong id="causeForce"></strong><span>安培力始终阻碍杆与导轨的相对运动</span></div></div>
          <div class="causal-step"><b>4</b><div><strong id="causeEnergy"></strong><span>匀速时，外力做功转化为电阻产生的焦耳热</span></div></div>
        </div>

        <div class="metrics">
          <div class="metric"><span>动生电动势 E</span><strong id="emfValue"></strong></div>
          <div class="metric"><span>回路电流 I</span><strong id="currentValue"></strong></div>
          <div class="metric"><span>安培力 F</span><strong id="forceValue"></strong></div>
          <div class="metric"><span>焦耳功率 P</span><strong id="powerValue"></strong></div>
        </div>
        <div class="formula" id="formulaLine"></div>
        <div class="conclusion" id="conclusion"></div>
      </aside>
    </section>
  </main>

  <script id="coursewareConfig" type="application/json">{"schema_version":1,"title":"匀强磁场中的滑动导体杆：向右切割","source_text":"平行金属导轨相距0.20 m，左端连接0.10 Ω电阻形成闭合回路。2.0 T匀强磁场垂直纸面向里，导体棒以0.25 m/s向右匀速运动。求电阻中的电流。","magnetic_field_t":2.0,"rod_length_m":0.2,"rod_speed_m_s":0.25,"resistance_ohm":0.1,"field_direction":"into_page","motion_direction":"right","duration_s":2.0}</script>
  <script id="lockedModel" type="application/json">{"model_version":"conducting-rod-uniform-field-v1","speed_multiplier":1.0,"speed_m_s":0.25,"emf_v":0.1,"current_a":1.0,"magnetic_force_n":0.4,"joule_power_w":0.1,"mechanical_power_w":0.1,"motion_sign":1,"field_sign":-1,"current_sign":1,"force_sign":-1,"induced_field_sign":1,"motion_label":"向右","field_label":"垂直纸面向里","field_symbol":"×","rod_current_label":"d → c（沿棒向上）","circuit_label":"逆时针","high_potential_endpoint":"c","force_label":"向左","induced_field_label":"垂直纸面向外"}</script>
  <script>
    (() => {
      'use strict';

      const config = Object.freeze(JSON.parse(document.getElementById('coursewareConfig').textContent));
      const lockedModel = Object.freeze(JSON.parse(document.getElementById('lockedModel').textContent));
      const state = {
        time: 0,
        speedMultiplier: 1,
        motionDirection: config.motion_direction,
        fieldDirection: config.field_direction,
        playing: false,
        lastFrame: 0
      };

      const $ = id => document.getElementById(id);
      const close = (a, b) => Math.abs(a - b) <= 1e-9 * Math.max(1, Math.abs(a), Math.abs(b));
      const sign = value => value >= 0 ? 1 : -1;
      const fmt = (value, digits = 2) => Number(value).toFixed(digits);

      function derive() {
        const motionSign = state.motionDirection === 'right' ? 1 : -1;
        const fieldSign = state.fieldDirection === 'out_of_page' ? 1 : -1;
        const currentSign = -motionSign * fieldSign;
        const forceSign = currentSign * fieldSign;
        const inducedFieldSign = currentSign;
        const speed = config.rod_speed_m_s * state.speedMultiplier;
        const emf = config.magnetic_field_t * config.rod_length_m * speed;
        const current = emf / config.resistance_ohm;
        const force = config.magnetic_field_t * current * config.rod_length_m;
        const power = current * current * config.resistance_ohm;
        return {
          motionSign, fieldSign, currentSign, forceSign, inducedFieldSign,
          speed, emf, current, force, power,
          motionLabel: motionSign > 0 ? '向右' : '向左',
          fieldLabel: fieldSign > 0 ? '垂直纸面向外' : '垂直纸面向里',
          fieldSymbol: fieldSign > 0 ? '•' : '×',
          currentLabel: currentSign > 0 ? 'd → c（沿棒向上）' : 'c → d（沿棒向下）',
          circuitLabel: currentSign > 0 ? '逆时针' : '顺时针',
          highEndpoint: currentSign > 0 ? 'c' : 'd',
          forceLabel: forceSign > 0 ? '向右' : '向左',
          inducedFieldLabel: inducedFieldSign > 0 ? '垂直纸面向外' : '垂直纸面向里'
        };
      }

      function assertModel(model) {
        const checks = [
          close(model.emf, config.magnetic_field_t * config.rod_length_m * model.speed),
          close(model.current, model.emf / config.resistance_ohm),
          close(model.force, config.magnetic_field_t * model.current * config.rod_length_m),
          model.forceSign === -model.motionSign,
          model.inducedFieldSign === -(model.fieldSign * model.motionSign),
          close(model.power, model.force * model.speed)
        ];
        if (checks.some(value => !value)) throw new Error('物理断言失败，页面已停止渲染。');
      }

      function assertLockedBaseline() {
        const model = derive();
        assertModel(model);
        const numericPairs = [
          [model.speed, lockedModel.speed_m_s],
          [model.emf, lockedModel.emf_v],
          [model.current, lockedModel.current_a],
          [model.force, lockedModel.magnetic_force_n],
          [model.power, lockedModel.joule_power_w]
        ];
        const directionsMatch = model.motionSign === lockedModel.motion_sign
          && model.fieldSign === lockedModel.field_sign
          && model.currentSign === lockedModel.current_sign
          && model.forceSign === lockedModel.force_sign;
        if (!directionsMatch || numericPairs.some(([actual, expected]) => !close(actual, expected))) {
          throw new Error('配置与生成端锁定结果不一致，页面已停止渲染。');
        }
      }

      function buildFieldMarks(symbol) {
        const group = $('fieldMarks');
        group.replaceChildren();
        for (let row = 0; row < 2; row += 1) {
          for (let col = 0; col < 7; col += 1) {
            const text = document.createElementNS('http://www.w3.org/2000/svg', 'text');
            text.setAttribute('x', String(180 + col * 78));
            text.setAttribute('y', String(172 + row * 72));
            text.setAttribute('class', 'field-mark');
            text.textContent = symbol;
            group.append(text);
          }
        }
      }

      function positionArrow(line, label, centerX, direction, length) {
        const start = centerX - direction * length * .5;
        const end = centerX + direction * length * .5;
        line.setAttribute('x1', String(start));
        line.setAttribute('x2', String(end));
        label.setAttribute('x', String(centerX));
      }

      function render() {
        const model = derive();
        assertModel(model);
        const progress = Math.min(1, Math.max(0, state.time / config.duration_s));
        const rodX = model.motionSign > 0 ? 250 + 320 * progress : 570 - 320 * progress;
        $('rodGroup').setAttribute('transform', `translate(${rodX} 0)`);

        const currentArrow = $('currentArrow');
        if (model.currentSign > 0) {
          currentArrow.setAttribute('y1', '265');
          currentArrow.setAttribute('y2', '126');
          $('currentLabel').setAttribute('y', '205');
        } else {
          currentArrow.setAttribute('y1', '126');
          currentArrow.setAttribute('y2', '265');
          $('currentLabel').setAttribute('y', '205');
        }

        positionArrow($('motionArrow'), $('motionLabel'), rodX, model.motionSign, 108);
        positionArrow($('forceArrow'), $('forceLabel'), rodX, model.forceSign, 92);
        buildFieldMarks(model.fieldSymbol);

        $('pageTitle').textContent = config.title;
        $('sourceText').textContent = config.source_text;
        $('sceneStatus').textContent = `物理时间 t = ${fmt(state.time)} s；演示倍率 0.5×`;
        $('timeValue').textContent = `${fmt(state.time)} s`;
        $('speedValue').textContent = `${fmt(model.speed)} m/s`;
        $('lengthLabel').textContent = `L = ${fmt(config.rod_length_m)} m`;
        $('fieldLabel').textContent = `B = ${fmt(config.magnetic_field_t)} T ${model.fieldSymbol}（${model.fieldLabel}）`;

        const areaAction = model.motionSign > 0 ? '回路面积增大' : '回路面积减小';
        const fluxAction = `${model.fieldLabel}方向的磁通量${model.motionSign > 0 ? '增加' : '减少'}`;
        $('causeMotion').textContent = `杆以 ${fmt(model.speed)} m/s ${model.motionLabel}运动`;
        $('causeFlux').textContent = `${areaAction}，${fluxAction}`;
        $('causeLenz').textContent = `感应磁场${model.inducedFieldLabel}`;
        $('causeCurrent').textContent = `由楞次定律得回路电流${model.circuitLabel}，杆中 ${model.currentLabel}`;
        $('causeForce').textContent = `安培力 ${fmt(model.force)} N ${model.forceLabel}`;
        $('causeEnergy').textContent = `机械功率 = 焦耳功率 = ${fmt(model.power)} W`;

        $('emfValue').textContent = `${fmt(model.emf)} V`;
        $('currentValue').textContent = `${fmt(model.current)} A`;
        $('forceValue').textContent = `${fmt(model.force)} N`;
        $('powerValue').textContent = `${fmt(model.power)} W`;
        $('formulaLine').innerHTML = `E=BLv=${fmt(config.magnetic_field_t)}×${fmt(config.rod_length_m)}×${fmt(model.speed)}=${fmt(model.emf)} V<br>I=E/R=${fmt(model.current)} A；F=BIL=${fmt(model.force)} N`;
        $('conclusion').textContent = `${model.highEndpoint} 端电势较高；杆中电流 ${model.currentLabel}；安培力${model.forceLabel}，与运动方向相反。`;

        $('sceneDesc').textContent = `导体杆${model.motionLabel}运动，磁场${model.fieldLabel}，杆中电流${model.currentLabel}，安培力${model.forceLabel}。`;
        document.querySelectorAll('[data-motion]').forEach(button => {
          button.setAttribute('aria-pressed', String(button.dataset.motion === state.motionDirection));
        });
        document.querySelectorAll('[data-field]').forEach(button => {
          button.setAttribute('aria-pressed', String(button.dataset.field === state.fieldDirection));
        });
      }

      function setPlaying(playing) {
        state.playing = playing;
        state.lastFrame = performance.now();
        $('playButton').textContent = playing ? '暂停' : (state.time >= config.duration_s ? '重新播放' : '播放慢放');
        $('playButton').setAttribute('aria-pressed', String(playing));
        if (playing) requestAnimationFrame(tick);
      }

      function tick(now) {
        if (!state.playing) return;
        const elapsed = Math.min(.1, (now - state.lastFrame) / 1000);
        state.lastFrame = now;
        state.time = Math.min(config.duration_s, state.time + elapsed * .5);
        $('timeRange').value = String(state.time);
        render();
        if (state.time >= config.duration_s) setPlaying(false);
        else requestAnimationFrame(tick);
      }

      function reset() {
        setPlaying(false);
        state.time = 0;
        state.speedMultiplier = 1;
        state.motionDirection = config.motion_direction;
        state.fieldDirection = config.field_direction;
        $('timeRange').value = '0';
        $('speedRange').value = '1';
        render();
      }

      try {
        assertLockedBaseline();
        $('timeRange').max = String(config.duration_s);
        $('timeRange').addEventListener('input', event => {
          setPlaying(false);
          state.time = Number(event.target.value);
          render();
        });
        $('speedRange').addEventListener('input', event => {
          state.speedMultiplier = Number(event.target.value);
          render();
        });
        $('playButton').addEventListener('click', () => {
          if (state.playing) setPlaying(false);
          else {
            if (state.time >= config.duration_s) {
              state.time = 0;
              $('timeRange').value = '0';
            }
            setPlaying(true);
          }
        });
        $('resetButton').addEventListener('click', reset);
        document.querySelectorAll('[data-motion]').forEach(button => {
          button.addEventListener('click', () => {
            setPlaying(false);
            state.motionDirection = button.dataset.motion;
            state.time = 0;
            $('timeRange').value = '0';
            render();
          });
        });
        document.querySelectorAll('[data-field]').forEach(button => {
          button.addEventListener('click', () => {
            state.fieldDirection = button.dataset.field;
            render();
          });
        });
        document.addEventListener('visibilitychange', () => {
          if (document.hidden) setPlaying(false);
        });
        render();
      } catch (error) {
        $('errorBox').style.display = 'block';
        $('errorBox').textContent = error instanceof Error ? error.message : '模板初始化失败。';
        document.querySelector('.workbench').hidden = true;
        console.error(error);
      }
    })();
  </script>
</body>
</html>
