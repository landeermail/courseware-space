  <rect width="1400" height="900" fill="#f5f8fc"/>
  <rect x="50" y="45" width="1300" height="810" rx="26" fill="white" filter="url(#shadow)"/>
  <text x="95" y="115" class="cn" font-size="30" font-weight="800">高中物理 · 电磁感应</text>
  <text x="95" y="158" class="cn" font-size="25">两根平行光滑金属导轨间距 L=1.50 m，左端接 R=0.75 Ω 的电阻，其余电阻不计。</text>
  <text x="95" y="196" class="cn" font-size="25">装置处在 B=0.35 T、垂直纸面向里的匀强磁场中，导体杆 cd 始终与导轨垂直，</text>
  <text x="95" y="234" class="cn" font-size="25">以 v=5.00 m/s 向右做匀速直线运动。</text>
  <text x="95" y="274" class="cn" font-size="25" font-weight="700">求电动势、电流、安培力，并说明能量转化关系。</text>
