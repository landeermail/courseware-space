  <text x="985" y="350" class="cn" font-size="28" font-weight="800">图示信息</text>
  <text x="985" y="410" class="cn" font-size="27">B = 0.35 T</text>
  <text x="985" y="458" class="cn" font-size="27">L = 1.50 m</text>
  <text x="985" y="506" class="cn" font-size="27">v = 5.00 m/s</text>
  <text x="985" y="554" class="cn" font-size="27">R = 0.75 Ω</text>
  <text x="985" y="618" class="cn" font-size="25" fill="#415a77">磁场：垂直纸面向里</text>
  <text x="985" y="666" class="cn" font-size="25" fill="#1769aa">运动：向右</text>
  <text x="95" y="810" class="cn" font-size="21" fill="#6a7990">样本编号：image-05　｜　所有数值均为题目直接给出</text>
