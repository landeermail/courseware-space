<!doctype html><html lang='zh-CN'><head><meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; img-src data: blob:; connect-src 'none'; object-src 'none'; frame-src 'none'; worker-src 'none'; media-src 'none'; font-src 'none'; form-action 'none'; base-uri 'none'"><meta charset='utf-8'><meta name='viewport' content='width=device-width,initial-scale=1'><title>匀速圆周运动：方向持续变化</title><style>*{box-sizing:border-box}body{margin:0;font:16px/1.5 system-ui,-apple-system,Segoe UI,Roboto,sans-serif;background:#0f172a;color:#e5e7eb}main{max-width:1080px;margin:0 auto;padding:14px}h1{font-size:22px;margin:6px 0 2px}.sub{color:#a5b4fc;margin:0 0 12px}.grid{display:grid;grid-template-columns:1.15fr .85fr;gap:14px}.card{background:#111827;border:1px solid #334155;border-radius:16px;padding:12px;box-shadow:0 8px 24px #0006}.stage{min-height:330px}svg{width:100%;height:auto;display:block;background:radial-gradient(circle at 50% 45%,#1e293b,#020617 72%);border-radius:14px}.lab{color:#cbd5e1;font-size:13px}.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin:9px 0}.ctl{flex:1 1 180px;min-width:170px}.ctl output{float:right;color:#fde68a}input[type=range]{width:100%;min-height:44px}button{min-height:44px;min-width:64px;border:0;border-radius:12px;padding:10px 14px;background:#2563eb;color:white;font-weight:700;cursor:pointer}button.ghost{background:#334155}button:active{transform:scale(.98)}.times{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}.pill{background:#0b1220;border:1px solid #475569;border-radius:12px;padding:8px;text-align:center}.pill b{display:block;font-size:18px;color:#fff}.read{white-space:pre-line;background:#020617;border:1px solid #475569;border-radius:12px;padding:10px;min-height:128px;color:#d1fae5}.hint{color:#94a3b8;font-size:13px}.v{stroke:#22c55e}.a{stroke:#ef4444}.r{stroke:#60a5fa}.txt{fill:#e5e7eb;font-size:12px}@media(max-width:760px){.grid{grid-template-columns:1fr}.times{grid-template-columns:repeat(2,1fr)}h1{font-size:19px}}</style></head><body><style>[data-control],[data-replay],button,select,input{min-height:44px}</style><script>
"use strict";

globalThis.CoursewarePrimitives = Object.freeze({
  createTimeline(options) {
    const duration = Number(options.durationPhysicalS);
    const onChange = options.onChange;
    if (!Number.isFinite(duration) || duration <= 0 || typeof onChange !== "function") {
      throw new Error("invalid timeline options");
    }
    let physicalTime = 0;
    let demoRate = 0.5;
    let playing = false;
    let frame = 0;
    let previous = 0;
    const emit = () => {
      if (typeof document !== "undefined" && document.documentElement) {
        document.documentElement.setAttribute("data-harness-physical-time", physicalTime.toFixed(6));
        document.documentElement.setAttribute("data-harness-playing", playing ? "true" : "false");
      }
      onChange(Object.freeze({ physicalTimeS: physicalTime, demoRate, playing }));
    };
    const tick = now => {
      if (!playing) return;
      if (!previous) previous = now;
      physicalTime = Math.min(duration, physicalTime + ((now - previous) / 1000) * demoRate);
      previous = now;
      emit();
      if (physicalTime >= duration) {
        playing = false;
        emit();
        return;
      }
      frame = requestAnimationFrame(tick);
    };
    const controller = Object.freeze({
      play() {
        if (playing || physicalTime >= duration) return;
        playing = true;
        previous = 0;
        emit();
        frame = requestAnimationFrame(tick);
      },
      pause() {
        playing = false;
        cancelAnimationFrame(frame);
        emit();
      },
      replay() {
        playing = false;
        cancelAnimationFrame(frame);
        physicalTime = 0;
        previous = 0;
        emit();
      },
      seek(value) {
        physicalTime = Math.max(0, Math.min(duration, Number(value)));
        emit();
      },
      setDemoRate(value) {
        const next = Number(value);
        if (!Number.isFinite(next) || next < 0.1 || next > 4) throw new Error("invalid demo rate");
        demoRate = next;
        emit();
      },
      snapshot() { return Object.freeze({ physicalTimeS: physicalTime, demoRate, playing }); },
    });
    emit();
    return controller;
  },
  formatPhysicalTime(value) { return `${Number(value).toFixed(2)} s（物理时间）`; },
  formatDemoRate(value) { return `${Number(value).toFixed(2)}×（演示倍率）`; },
});

</script><script>
globalThis.coursewareModel=Object.freeze({sample:function(input){var sc=(input&&input.scenario)||{};function N(x,d){var v=Number(x);return Number.isFinite(v)?v:d}var G=N(sc.G_n_m2_kg2,0),M=N(sc.central_mass_kg,0),g=N(sc.g_m_s2,0),m=N(sc.mass_kg,0),r=N(sc.radius_m,0),v0=N(sc.speed_m_s,0),mode=sc.mode||'uniform';var ang=(input&&Array.isArray(input.angles_rad))?input.angles_rad:[0,Math.PI/2,Math.PI,1.5*Math.PI];function orbitV(){return(r>0&&G*M>0)?Math.sqrt(G*M/r):0}function accFor(v){return r>0?v*v/r:0}function state(th){var c=Math.cos(th),s=Math.sin(th),x,y,v,ac,ax,ay,rf,tn,K,U,me,tm;if(mode==='vertical_string'){x=r*s;y=-r*c;U=m*g*r*(1-c);var v2=v0*v0-2*g*r*(1-c);if(v2<0){v2=0}v=Math.sqrt(v2);ac=accFor(v);tm=ac+g*c;tn=m*tm;ax=-tm*s;ay=tm*c-g;rf=m*ac;K=0.5*m*v*v;me=K+U}else if(mode==='orbit'){v=orbitV();ac=accFor(v);x=r*c;y=r*s;ax=-ac*c;ay=-ac*s;rf=m*ac;tn=0;K=0.5*m*v*v;U=r>0?-G*M*m/r:0;me=K+U}else{v=v0;ac=accFor(v);x=r*c;y=r*s;ax=-ac*c;ay=-ac*s;rf=m*ac;tn=0;K=0.5*m*v*v;U=0;me=K}return{angle_rad:th,x_m:x,y_m:y,speed_m_s:v,ax_m_s2:ax,ay_m_s2:ay,radial_force_n:rf,tension_n:tn,kinetic_j:K,potential_j:U,mechanical_j:me}}var states=ang.map(function(a){return state(N(a,0))});var period=null,cent=0,ev;if(mode==='orbit'){var vo=orbitV();cent=accFor(vo);period=vo>0?2*Math.PI*r/vo:null;ev={period_s:period,centripetal_acceleration_m_s2:cent}}else if(mode==='vertical_string'){cent=accFor(v0);var ok=true,n=8192,hh=2*Math.PI/n,sum=0;for(var i=0;i<=n;i++){var th=i*hh,c=Math.cos(th),v2=v0*v0-2*g*r*(1-c);if(!(r>0&&v2>0)){ok=false;break}var w=(i===0||i===n)?1:(i%2===1?4:2);sum+=w*r/Math.sqrt(v2)}period=ok?sum*hh/3:null;ev={period_s:period,centripetal_acceleration_m_s2:cent,critical_top_speed_m_s:Math.sqrt(Math.max(g*r,0)),critical_bottom_speed_m_s:Math.sqrt(Math.max(5*g*r,0))}}else{cent=accFor(v0);period=(v0>0&&r>0)?2*Math.PI*r/v0:null;ev={period_s:period,centripetal_acceleration_m_s2:cent}}return{states:states,events:ev}}});
</script><script>globalThis.__HARNESS_INPUT__=Object.freeze({"scenario":{"mode":"uniform","mass_kg":40.0,"radius_m":3.0,"g_m_s2":9.8,"speed_m_s":5.0,"central_mass_kg":0.0,"G_n_m2_kg2":6.6743e-11},"angles_rad":[0.0,0.6981317007977318,1.3962634015954636,2.0943951023931953,2.792526803190927,3.490658503988659,4.1887902047863905,4.886921905584122,5.585053606381854]});</script><script>
(()=>{
  const root=document.documentElement;
  const short=value=>String(value&&value.message||value||'unknown runtime error').slice(0,500);
  addEventListener('error',event=>root.setAttribute('data-harness-runtime-error',short(event.error||event.message)),true);
  addEventListener('unhandledrejection',event=>root.setAttribute('data-harness-runtime-error',short(event.reason)),true);
  const expected=globalThis.__HARNESS_INPUT__.scenario;
  const original=globalThis.coursewareModel;
  let calls=0;
  const same=(left,right)=>{
    if(left===right)return true;
    if(!left||!right||typeof left!=='object'||typeof right!=='object')return false;
    const leftKeys=Object.keys(left).sort(),rightKeys=Object.keys(right).sort();
    return leftKeys.length===rightKeys.length&&leftKeys.every((key,index)=>key===rightKeys[index]&&same(left[key],right[key]));
  };
  const guarded=Object.freeze({sample(input){
    calls+=1;
    root.setAttribute('data-harness-sample-count',String(calls));
    if(calls===1){
      const matched=Boolean(input&&same(input.scenario,expected));
      root.setAttribute('data-harness-initial-scenario',matched?'matched':'mismatched');
      if(!matched)throw new Error('首次采样场景与老师确认题设不一致');
    }
    return original.sample(input);
  }});
  Object.defineProperty(globalThis,'coursewareModel',{value:guarded,writable:false,configurable:false});
})();
</script><main><h1>匀速圆周运动：看方向怎样一直变</h1><p class='sub'>拖到任意物理时间，观察切线速度、指向圆心的加速度与径向力；改参后会重新采样并回到 0 秒暂停。</p><section class='grid'><div class='card stage'><svg viewBox='0 0 420 330' aria-label='圆周运动舞台'><defs><marker id='m' viewBox='0 0 10 10' refX='8' refY='5' markerWidth='6' markerHeight='6' orient='auto-start-reverse'><path d='M0 0L10 5L0 10z' fill='currentColor'/></marker></defs><circle cx='210' cy='165' r='118' fill='none' stroke='#334155' stroke-dasharray='4 6'/><circle id='path' cx='210' cy='165' r='100' fill='none' stroke='#64748b' stroke-width='2'/><line id='rad' class='r' x1='210' y1='165' x2='210' y2='65' stroke-width='3' marker-end='url(#m)'/><line id='vel' class='v' x1='210' y1='65' x2='260' y2='65' stroke-width='4' marker-end='url(#m)'/><line id='acc' class='a' x1='210' y1='65' x2='210' y2='115' stroke-width='4' marker-end='url(#m)'/><circle id='stu' cx='210' cy='65' r='8' fill='#fbbf24' stroke='#78350f' stroke-width='2'/><text class='txt' x='14' y='24'>绿：速度方向　红：向心加速度　蓝：半径/径向力方向</text><text id='ang' class='txt' x='14' y='308'>采样角 0.00 rad</text></svg><div class='row'><button id='play'>播放</button><button data-replay class='ghost'>回到 0 并重播</button><button class='ghost' data-rate='0.25'>0.25×</button><button class='ghost' data-rate='1'>1×</button><button class='ghost' data-rate='2'>2×</button></div><input id='scrub' data-control type='range' min='0' max='1000' value='0' aria-label='拖动一个周期内的物理时间'><div class='times'><div class='pill'><span class='lab'>物理时间</span><b data-physical-time>0.00 s</b></div><div class='pill'><span class='lab'>演示倍率</span><b data-demo-time>1.00×</b></div><div class='pill'><span class='lab'>周期(模型)</span><b id='per'>-</b></div><div class='pill'><span class='lab'>向心加速度(模型)</span><b id='ca'>-</b></div></div></div><aside class='card'><h2 style='margin:2px 0 8px;font-size:18px'>可调场景参数</h2><label class='ctl'>速率 v <output id='ov'></output><input id='speed' data-control type='range' min='1' max='12' step='0.1'></label><label class='ctl'>半径 r <output id='or'></output><input id='radius' data-control type='range' min='1.5' max='6' step='0.1'></label><label class='ctl'>质量 m <output id='om'></output><input id='mass' data-control type='range' min='20' max='80' step='1'></label><div class='row'><span class='hint'>只改变 uniform 场景的 v、r、m；mode、G、g 等保持老师确认值。</span></div><h2 style='margin:10px 0 8px;font-size:18px'>状态读数</h2><div class='read' data-readout>等待模型采样…</div><p class='hint'>因果观察点：速率大小不变时，速度方向仍随位置转动；加速度不为零，因为它描述的是方向变化率。</p></aside></section></main><script>(function(){'use strict';var $=function(s){return document.querySelector(s)};var hi=globalThis.__HARNESS_INPUT__;if(!hi||!hi.scenario){$('[data-readout]').textContent='未检测到老师确认场景。';return}var base=hi.scenario,scenario=Object.assign({},base);var N=241,data=null,period=1,playing=false;var phys=$('[data-physical-time]'),demo=$('[data-demo-time]'),read=$('[data-readout]'),stu=$('#stu'),vel=$('#vel'),acc=$('#acc'),rad=$('#rad'),path=$('#path'),ang=$('#ang');var sp=$('#speed'),ra=$('#radius'),ma=$('#mass'),ov=$('#ov'),or=$('#or'),om=$('#om');function labs(){ov.textContent=Number(scenario.speed_m_s).toFixed(1)+' m/s';or.textContent=Number(scenario.radius_m).toFixed(1)+' m';om.textContent=Number(scenario.mass_kg).toFixed(0)+' kg'}function axis(){var a=[];for(var i=0;i<N;i++){a.push(i*Math.PI*2/(N-1))}return a}function sample(){data=coursewareModel.sample({scenario:Object.assign({},scenario),angles_rad:axis()});period=data.events&&data.events.period_s>0?data.events.period_s:1;$('#per').textContent=period.toFixed(3)+' s';$('#ca').textContent=Number(data.events.centripetal_acceleration_m_s2).toFixed(3)+' m/s²'}function scale(){return 100/Math.max(1,scenario.radius_m)}function setLine(l,x1,y1,x2,y2){l.setAttribute('x1',x1);l.setAttribute('y1',y1);l.setAttribute('x2',x2);l.setAttribute('y2',y2)}function fmt(x,d){return Number(x).toFixed(d)}function render(t){if(!data||!data.states||!data.states.length)return;var f=(t%period)/period,i=Math.max(0,Math.min(data.states.length-1,Math.round(f*(data.states.length-1))));var s=data.states[i],k=scale(),cx=210,cy=165,x=cx+s.x_m*k,y=cy-s.y_m*k;path.setAttribute('r',scenario.radius_m*k);stu.setAttribute('cx',x);stu.setAttribute('cy',y);setLine(rad,cx,cy,x,y);var j=i<data.states.length-1?i+1:0,h=i>0?i-1:data.states.length-1,vx=(data.states[j].x_m-data.states[h].x_m)*k,vy=-((data.states[j].y_m-data.states[h].y_m)*k);var vl=Math.hypot(vx,vy);if(vl>1e-9&&s.speed_m_s>1e-9){vx=vx/vl*54;vy=vy/vl*54;setLine(vel,x,y,x+vx,y+vy)}else{setLine(vel,x,y,x,y)}var ax=s.ax_m_s2*k,ay=-s.ay_m_s2*k,al=Math.hypot(ax,ay);if(al>1e-9){ax=ax/al*64;ay=ay/al*64;setLine(acc,x,y,x+ax,y+ay)}else{setLine(acc,x,y,x,y)}ang.textContent='采样角 '+fmt(s.angle_rad,2)+' rad';read.textContent='位置 x='+fmt(s.x_m,2)+' m, y='+fmt(s.y_m,2)+' m\n速率 |v|='+fmt(s.speed_m_s,2)+' m/s（方向见绿箭头）\n加速度 ax='+fmt(s.ax_m_s2,2)+', ay='+fmt(s.ay_m_s2,2)+' m/s²\n径向力='+fmt(s.radial_force_n,1)+' N，绳/支持等效张力='+fmt(s.tension_n,1)+' N\n动能='+fmt(s.kinetic_j,1)+' J，势能='+fmt(s.potential_j,1)+' J，机械能='+fmt(s.mechanical_j,1)+' J'}sp.value=base.speed_m_s;ra.value=base.radius_m;ma.value=base.mass_kg;scenario=Object.assign({},base);labs();sample();var tl=CoursewarePrimitives.createTimeline({durationPhysicalS:3600,onChange:function(st){playing=!!st.playing;$('#play').textContent=playing?'暂停':'播放';phys.textContent=CoursewarePrimitives.formatPhysicalTime(st.physicalTimeS);demo.textContent=CoursewarePrimitives.formatDemoRate(st.demoRate);render(st.physicalTimeS)}});function stop0(){tl.pause();tl.seek(0);playing=false;$('#play').textContent='播放';$('#scrub').value=0}function changed(){scenario.speed_m_s=Number(sp.value);scenario.radius_m=Number(ra.value);scenario.mass_kg=Number(ma.value);labs();sample();stop0();render(0)}[sp,ra,ma].forEach(function(el){el.addEventListener('input',changed);el.addEventListener('change',changed)});$('#play').addEventListener('click',function(){if(playing){tl.pause()}else{tl.play()}});$('[data-replay]').addEventListener('click',function(){tl.replay()});Array.prototype.forEach.call(document.querySelectorAll('[data-rate]'),function(b){b.addEventListener('click',function(){tl.setDemoRate(Number(b.getAttribute('data-rate')))})});$('#scrub').addEventListener('input',function(){var f=Number(this.value)/1000;tl.pause();tl.seek(f*period);playing=false;$('#play').textContent='播放'});document.addEventListener('visibilitychange',function(){if(document.hidden){tl.pause();playing=false;$('#play').textContent='播放'}});stop0();render(0)})();</script></body></html>
