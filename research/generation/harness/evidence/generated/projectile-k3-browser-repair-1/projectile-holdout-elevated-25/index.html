d:#0b1220;border:1px solid var(--line);border-radius:10px;padding:8px 10px}.kv span{color:var(--mut);font-size:12px;display:block}.kv b{font-size:16px}.note{color:var(--mut);font-size:13px}.legend{display:flex;gap:14px;flex-wrap:wrap;color:var(--mut);font-size:13px;margin-top:8px}.dot{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:6px;vertical-align:-1px}</style></head><body><div class="wrap"><h1>斜抛与平抛：最高点与落地点</h1><p class="sub">从 12 m 高处以 16 m/s、仰角 25° 抛出 0.6 kg 小球，g = 9.8 m/s²。调节初始条件，观察最高点与落地点怎样被决定。</p><div class="grid"><div class="card"><svg id="stage" viewBox="0 0 640 420" role="img" aria-label="抛体运动轨迹"></svg><div class="legend"><span><i class="dot" style="background:#38bdf8"></i>轨迹</span><span><i class="dot" style="background:#fbbf24"></i>小球</span><span><i class="dot" style="background:#34d399"></i>速度 v</span><span><i class="dot" style="background:#fb7185"></i>重力加速度 g</span><span><i class="dot" style="background:#c4b5fd"></i>最高点</span></div><div class="row" style="margin-top:12px"><button class="btn primary" id="playBtn">▶ 播放</button><button class="btn" data-replay id="replayBtn">↺ 回放</button><input type="range" id="scrub" min="0" max="1000" value="0" step="1" style="flex:1;min-height:44px" aria-label="拖动时间轴"></div><div class="row" style="margin-top:10px"><span class="pill">物理时间 <b data-physical-time id="tPhys">0.00 s</b></span><span class="pill">演示倍率 <b data-demo-time id="tDemo">1.0×</b></span><span class="pill">状态 <b data-readout id="readout">待抛出</b></span></div><div class="row" style="margin-top:10px"><span class="note">演示倍率</span><button class="btn rate" data-r="0.5">0.5×</button><button class="btn rate" data-r="1">1×</button><button class="btn rate" data-r="2">2×</button><button class="btn rate" data-r="4">4×</button></div></div><div class="card ctrl"><label>初速度 v₀ <span id="vVal"></span><input data-control id="c_v" type="range" min="2" max="40" step="0.5"></label><label>仰角 θ（负值为平抛以下）<span id="aVal"></span><input data-control id="c_a" type="range" min="-80" max="80" step="1"></label><label>初始高度 y₀ <span id="hVal"></span><input data-control id="c_y" type="range" min="0" max="40" step="0.5"></label><label>初始水平位置 x₀ <span id="xVal"></span><input data-control id="c_x" type="range" min="-20" max="20" step="0.5"></label><label>重力加速度 g <span id="gVal"></span><input data-control id="c_g" type="range" min="1" max="25" step="0.1"></label><div class="kv"><div><span>最高点时刻</span><b id="kApexT">—</b></div><div><span>最高点高度</span><b id="kApexH">—</b></div><div><span>飞行时间</span><b id="kFlight">—</b></div><div><span>水平射程</span><b id="kRange">—</b></div><div><span>动能 / 势能</span><b id="kEnergy">—</b></div><div><span>机械能（守恒）</span><b id="kMech">—</b></div></div><p class="note">观察要点：最高点处竖直分速度为 0，但水平分速度保持不变；落地点由飞行时间与水平初速共同决定。全程机械能守恒，上升段动能转化为势能，下降段相反。</p></div></div></div>
<style>[data-control],[data-replay],button,select,input{min-height:44px}</style><script>
"use strict";

globalThis.CoursewarePrimitives = Object.freeze({
  createTimeline(options) {
    const duration = Number(options.durationPhysicalS);
    const onChange = options.onChange;
    if (!Number.isFinite(duration) || duration <= 0 || typeof onChange !== "function") {
      throw new Error("invalid timeline options");
    }
    let physicalTime = 0;
    let demoRate = 0.5;
    let playing = false;
    let frame = 0;
    let previous = 0;
    const emit = () => {
      if (typeof document !== "undefined" && document.documentElement) {
        document.documentElement.setAttribute("data-harness-physical-time", physicalTime.toFixed(6));
        document.documentElement.setAttribute("data-harness-playing", playing ? "true" : "false");
      }
      onChange(Object.freeze({ physicalTimeS: physicalTime, demoRate, playing }));
    };
    const tick = now => {
      if (!playing) return;
      if (!previous) previous = now;
      physicalTime = Math.min(duration, physicalTime + ((now - previous) / 1000) * demoRate);
      previous = now;
      emit();
      if (physicalTime >= duration) {
        playing = false;
        emit();
        return;
      }
      frame = requestAnimationFrame(tick);
    };
    return Object.freeze({
      play() {
        if (playing || physicalTime >= duration) return;
        playing = true;
        previous = 0;
        emit();
        frame = requestAnimationFrame(tick);
      },
      pause() {
        playing = false;
        cancelAnimationFrame(frame);
        emit();
      },
      replay() {
        playing = false;
        cancelAnimationFrame(frame);
        physicalTime = 0;
        previous = 0;
        emit();
      },
      seek(value) {
        physicalTime = Math.max(0, Math.min(duration, Number(value)));
        emit();
      },
      setDemoRate(value) {
        const next = Number(value);
        if (!Number.isFinite(next) || next < 0.1 || next > 4) throw new Error("invalid demo rate");
        demoRate = next;
        emit();
      },
      snapshot() { return Object.freeze({ physicalTimeS: physicalTime, demoRate, playing }); },
    });
  },
  formatPhysicalTime(value) { return `${Number(value).toFixed(2)} s（物理时间）`; },
  formatDemoRate(value) { return `${Number(value).toFixed(2)}×（演示倍率）`; },
});

</script>
<script>
globalThis.coursewareModel=Object.freeze({sample(input){const s=(input&&input.scenario)||{};const arr=(input&&input.times_s)||[];const g=Number(s.g_m_s2),m=Number(s.mass_kg),v=Number(s.speed_m_s),x0=Number(s.x0_m),y0=Number(s.y0_m),a=Number(s.angle_deg)*Math.PI/180;const vx0=v*Math.cos(a),vy0=v*Math.sin(a);const q=vy0*vy0+2*g*y0;const T=g>0?(vy0+Math.sqrt(Math.max(0,q)))/g:0;const R=vx0*T;const ta=vy0>0&&g>0?Math.min(vy0/g,T):0;const h=y0+(vy0>0&&g>0?vy0*vy0/(2*g):0);const xl=x0+R,vyT=vy0-g*T,keT=0.5*m*(vx0*vx0+vyT*vyT);const states=arr.map(function(z){const t=Number(z);if(t>T){return {t_s:t,x_m:xl,y_m:0,vx_m_s:vx0,vy_m_s:vyT,ax_m_s2:0,ay_m_s2:-g,kinetic_j:keT,potential_j:0,mechanical_j:keT};}const x=x0+vx0*t;let y=y0+vy0*t-0.5*g*t*t;if(y<0&&t>=T)y=0;const vx=vx0,vy=vy0-g*t;const ke=0.5*m*(vx*vx+vy*vy),pe=m*g*y;return {t_s:t,x_m:x,y_m:y,vx_m_s:vx,vy_m_s:vy,ax_m_s2:0,ay_m_s2:-g,kinetic_j:ke,potential_j:pe,mechanical_j:ke+pe};});return {states:states,events:{flight_time_s:T,range_m:R,apex_time_s:ta,max_height_m:h,optimal_equal_height_angle_deg:45}};}})
</script>
<script>globalThis.__HARNESS_INPUT__=Object.freeze({"scenario":{"mode":"oblique","g_m_s2":9.8,"mass_kg":0.6,"x0_m":-2.0,"y0_m":12.0,"speed_m_s":16.0,"angle_deg":25.0},"times_s":[0.0,0.3000338708516572,0.6000677417033145,0.9001016125549717,1.200135483406629,1.5001693542582861,1.8002032251099434,2.1002370959616004,2.400270966813258]});</script><script>
(()=>{
  const root=document.documentElement;
  const short=value=>String(value&&value.message||value||'unknown runtime error').slice(0,500);
  addEventListener('error',event=>root.setAttribute('data-harness-runtime-error',short(event.error||event.message)),true);
  addEventListener('unhandledrejection',event=>root.setAttribute('data-harness-runtime-error',short(event.reason)),true);
  const expected=globalThis.__HARNESS_INPUT__.scenario;
  const original=globalThis.coursewareModel;
  let calls=0;
  const same=(left,right)=>{
    if(left===right)return true;
    if(!left||!right||typeof left!=='object'||typeof right!=='object')return false;
    const leftKeys=Object.keys(left).sort(),rightKeys=Object.keys(right).sort();
    return leftKeys.length===rightKeys.length&&leftKeys.every((key,index)=>key===rightKeys[index]&&same(left[key],right[key]));
  };
  const guarded=Object.freeze({sample(input){
    calls+=1;
    root.setAttribute('data-harness-sample-count',String(calls));
    if(calls===1){
      const matched=Boolean(input&&same(input.scenario,expected));
      root.setAttribute('data-harness-initial-scenario',matched?'matched':'mismatched');
      if(!matched)throw new Error('首次采样场景与老师确认题设不一致');
    }
    return original.sample(input);
  }});
  Object.defineProperty(globalThis,'coursewareModel',{value:guarded,writable:false,configurable:false});
})();
</script>

vents.flight_time_s," s");document.getElementById("kRange").textContent=fmt(data.events.range_m," m");}function stateAt(t){var ss=data.states;if(t<=0){return ss[0];}if(t>=DUR){return ss[ss.length-1];}var f=t/DUR*(ss.length-1),i=Math.floor(f),r=f-i,a=ss[i],b=ss[Math.min(i+1,ss.length-1)],o={};for(var k in a){o[k]=typeof a[k]==="number"?a[k]+(b[k]-a[k])*r:a[k];}return o;}function render(st){if(!data){return;}var s=stateAt(st.physicalTimeS),p=toPx(s.x_m,s.y_m);ball.setAttribute("cx",p[0]);ball.setAttribute("cy",p[1]);var vs=Math.hypot(s.vx_m_s,s.vy_m_s)||1e-6,vl=Math.min(vs*4,70)/vs;vArrow.setAttribute("x1",p[0]);vArrow.setAttribute("y1",p[1]);vArrow.setAttribute("x2",p[0]+s.vx_m_s*vl);vArrow.setAttribute("y2",p[1]-s.vy_m_s*vl);gArrow.setAttribute("x1",p[0]);gArrow.setAttribute("y1",p[1]);gArrow.setAttribute("x2",p[0]);gArrow.setAttribute("y2",p[1]+34);document.getElementById("tPhys").textContent=CoursewarePrimitives.formatPhysicalTime(st.physicalTimeS);var dr=CoursewarePrimitives.formatDemoRate(st.demoRate);if(dr!==lastRate){lastRate=dr;document.getElementById("tDemo").textContent=dr;}var ft=data.events.flight_time_s,ap=data.events.apex_time_s;var ro=st.physicalTimeS>=ft-1e-9?"已落地（y=0）":(Math.abs(st.physicalTimeS-ap)<DUR/N?"经过最高点：竖直分速度≈0":(st.physicalTimeS<ap?"上升段：动能 → 势能":"下降段：势能 → 动能"));document.getElementById("readout").textContent=ro;document.getElementById("kEnergy").textContent=s.kinetic_j.toFixed(1)+" / "+s.potential_j.toFixed(1)+" J";document.getElementById("kMech").textContent=s.mechanical_j.toFixed(1)+" J";document.getElementById("scrub").value=Math.round(st.physicalTimeS/DUR*1000);document.getElementById("playBtn").textContent=st.playing?"⏸ 暂停":"▶ 播放";}var controls=[["c_v","speed_m_s","vVal"," m/s"],["c_a","angle_deg","aVal","°"],["c_y","y0_m","hVal"," m"],["c_x","x0_m","xVal"," m"],["c_g","g_m_s2","gVal"," m/s²"]];controls.forEach(function(c){var box=document.getElementById(c[0]);box.value=scenario[c[1]];document.getElementById(c[2]).textContent=scenario[c
