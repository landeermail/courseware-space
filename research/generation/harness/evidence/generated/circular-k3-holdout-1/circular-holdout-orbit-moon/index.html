  createTimeline(options) {
    const duration = Number(options.durationPhysicalS);
    const onChange = options.onChange;
    if (!Number.isFinite(duration) || duration <= 0 || typeof onChange !== "function") {
      throw new Error("invalid timeline options");
    }
    let physicalTime = 0;
    let demoRate = 0.5;
    let playing = false;
    let frame = 0;
    let previous = 0;
    const emit = () => {
      if (typeof document !== "undefined" && document.documentElement) {
        document.documentElement.setAttribute("data-harness-physical-time", physicalTime.toFixed(6));
        document.documentElement.setAttribute("data-harness-playing", playing ? "true" : "false");
      }
      onChange(Object.freeze({ physicalTimeS: physicalTime, demoRate, playing }));
    };
    const tick = now => {
      if (!playing) return;
      if (!previous) previous = now;
      physicalTime = Math.min(duration, physicalTime + ((now - previous) / 1000) * demoRate);
      previous = now;
      emit();
      if (physicalTime >= duration) {
        playing = false;
        emit();
        return;
      }
      frame = requestAnimationFrame(tick);
    };
    const controller = Object.freeze({
      play() {
        if (playing || physicalTime >= duration) return;
        playing = true;
        previous = 0;
        emit();
        frame = requestAnimationFrame(tick);
      },
      pause() {
        playing = false;
        cancelAnimationFrame(frame);
        emit();
      },
      replay() {
        playing = false;
        cancelAnimationFrame(frame);
        physicalTime = 0;
        previous = 0;
        emit();
      },
      seek(value) {
        physicalTime = Math.max(0, Math.min(duration, Number(value)));
        emit();
      },
      setDemoRate(value) {
        const next = Number(value);
        if (!Number.isFinite(next) || next < 0.1 || next > 4) throw new Error("invalid demo rate");
        demoRate = next;
        emit();
      },
      snapshot() { return Object.freeze({ physicalTimeS: physicalTime, demoRate, playing }); },
    });
    emit();
    return controller;
  },
  formatPhysicalTime(value) { return `${Number(value).toFixed(2)} s（物理时间）`; },
  formatDemoRate(value) { return `${Number(value).toFixed(2)}×（演示倍率）`; },
});

  sample(input) {

        ay_m_s2: ay,
        radial_force_n: Frad,
        tension_n: T,
        kinetic_j: ke,
        potential_j: pe,
        mechanical_j: ke + pe
      };
    }

    var states = [];
    var events = { period_s: 0, centripetal_acceleration_m_s2: 0 };
    var i, th;

    if (mode === 'orbit') {
      var vOrb = Math.sqrt(G * M / r);

          th,
          r * Math.cos(th),
          r * Math.sin(th),
          vOrb,
          -aOrb * Math.cos(th),
          -aOrb * Math.sin(th),
          FOrb,
          0,
          keOrb,
          peOrb

      }

      events.centripetal_acceleration_m_s2 = aOrb;
    } else if (mode === 'vertical_string') {
      var v0 = vGiven;
      var v0sq = v0 * v0;

        th = angles[i];
        var sn = Math.sin(th);
        var cs = Math.cos(th);

          ax,
          ay,
          m * arad,
          tension,
          ke,

          r * Math.sin(th),
          vU,
          -aU * Math.cos(th),
          -aU * Math.sin(th),
          FU,
          FU,
          keU,
          0
        ));
      }
      events.period_s = (vU > 0) ? (2 * Math.PI * r / vU) : Infinity;
      events.centripetal_acceleration_m_s2 = aU;
    }

    return { states: states, events: events };
  }
});

ll,duration=1,idx=0,rate=1,playing=false;function mk(){angles=[];for(var i=0;i<N;i++){angles.push(i/(N-1)*Math.PI*2)}}function fmtCtl(){set('#rv',num(+q('#r').value));set('#cmv',num(+q('#cm').value));set('#mv',num(+q('#m').value))}function initCtl(){q('#r').min=sc.radius_m*0.55;q('#r').max=sc.radius_m*1.45;q('#r').step=sc.radius_m/500;q('#r').value=sc.radius_m;q('#cm').min=sc.central_mass_kg*0.55;q('#cm').max=sc.central_mass_kg*1.45;q('#cm').step=sc.central_mass_kg/500;q('#cm').value=sc.central_mass_kg;q('#m').min=sc.mass_kg*0.25;q('#m').max=sc.mass_kg*4;q('#m').step=1;q('#m').value=sc.mass_kg;fmtCtl()}function changedScenario(){return {G_n_m2_kg2:sc.G_n_m2_kg2,central_mass_kg:+q('#cm').value,g_m_s2:sc.g_m_s2,mass_kg:+q('#m').value,mode:'orbit',radius_m:+q('#r').value,speed_m_s:sc.speed_m_s}}function line(id,x1,y1,x2,y2){var e=q(id);e.setAttribute('x1',x1);e.setAttribute('y1',y1);e.setAttribute('x2',x2);e.setAttribute('y2',y2)}function draw(i){if(!res)return;var s=res.states[i],R=120,k=R/(+q('#r').value),x=s.x_m*k,y=s.y_m*k,n=res.states[(i+1)%N];q('#sat').setAttribute('cx',x);q('#sat').setAttribute('cy',y);q('#lab').setAttribute('x',x+12);q('#lab').setAttribute('y',y-8);var vx=(n.x_m-s.x_m)*k,vy=(n.y_m-s.y_m)*k,vl=Math.sqrt(vx*vx+vy*vy)||1,vs=30+Math.min(30,s.speed_m_s/50);line('#vel',x,y,x+vx/vl*vs,y+vy/vl*vs);var al=Math.sqrt(s.ax_m_s2*s.ax_m_s2+s.ay_m_s2*s.ay_m_s2)||1;line('#acc',x,y,x+s.ax_m_s2/al*58,y+s.ay_m_s2/al*58);var fl=Math.max(1,Math.abs(s.radial_force_n));var fx=-x,fy=-y,rl=Math.sqrt(fx*fx+fy*fy)||1;var flen=18+Math.min(42,fl/(+q('#m').value));line('#frc',x,y,x+fx/rl*flen,y+fy/rl*flen);var mx=Math.max(Math.abs(s.kinetic_j),Math.abs(s.potential_j),Math.abs(s.mechanical_j),1);q('#bek').style.width=Math.abs(s.kinetic_j)/mx*100+'%';q('#bep').style.width=Math.abs(s.potential_j)/mx*100+'%';q('#bem').style.width=Math.abs(s.mechanical_j)/mx*100+'%';set('#ek',num(s.kinetic_j)+' J');set('#ep',num(s.potential_j)+' J');set('#em',num(s.mechanical_j)+' J');set('#sp',num(s.speed_m_s)+' m/s');set('#gf',num(s.radial_force_n)+' N')}function labels(t,r,p){set('#pt',P.formatPhysicalTime(t));set('#dt',P.formatDemoRate(r));set('#per',P.formatPhysicalTime(res.events.period_s));set('#ca',num(res.events.centripetal_acceleration_m_s2)+' m/s²');set('#read','位置角 '+num(res.states[idx].angle_rad)+' rad；'+(p?'正在播放':'已暂停')+'；观察加速度与引力始终指向月心，速度沿切线。')}function onT(st){playing=st.playing;rate=st.demoRate;idx=Math.min(N-1,Math.max(0,Math.round(st.physicalTimeS/duration*(N-1))));draw(idx);labels(st.physicalTimeS,st.demoRate,st.playing);q('#seek').value=st.physicalTimeS/duration}function sample(ch){var scenario=ch?changedScenario():sc;res=M.sample({scenario:scenario,angles_rad:angles});duration=res.events.period_s>0?res.events.period_s:1;if(tl){tl.pause()}tl=P.createTimeline({durationPhysicalS:duration,onChange:onT});tl.pause();playing=false;idx=0;draw(0);labels(0,1,false);set('#err','')}mk();initCtl();sample(false);q('#r').addEventListener('input',function(){fmtCtl();sample(true)});q('#cm').addEventListener('input',function(){fmtCtl();sample(true)});q('#m').addEventListener('input',function(){fmtCtl();sample(true)});q('#play').addEventListener('click',function(){if(tl)tl.play()});q('#pause').addEventListener('click',function(){if(tl)tl.pause()});q('#replay').addEventListener('click',function(){if(tl)tl.replay()});q('#rate').addEventListener('change',function(){if(tl)tl.setDemoRate(+q('#rate').value)});q('#seek').addEventListener('input',function(){if(tl)tl.seek(+q('#seek').value*duration)});document.addEventListener('visibilitychange',function(){if(document.hidden&&tl)tl.pause()});})();</script></body></html>
