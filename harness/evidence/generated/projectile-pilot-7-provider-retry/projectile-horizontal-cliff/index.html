<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>平抛与斜抛运动纯物理模型</title>
<style>
:root{--bg:#f4f7fb;--panel:#fff;--accent:#2563eb;--v:#16a34a;--a:#dc2626;--k:#22c55e;--p:#f59e0b;--m:#3b82f6;--text:#1f2937;}
*{box-sizing:border-box}
body{margin:0;font-family:system-ui,-apple-system,Segoe UI,Roboto,Noto Sans SC,sans-serif;background:var(--bg);color:var(--text);line-height:1.4}
header{padding:12px 16px;background:var(--panel);border-bottom:1px solid #e5e7eb}
h1{margin:0;font-size:1.15rem}
.tip{font-size:.85rem;color:#4b5563}
.wrap{display:flex;gap:12px;padding:12px;max-width:1200px;margin:0 auto}
.stage{flex:1 1 60%;min-width:0;background:var(--panel);border-radius:12px;box-shadow:0 1px 4px rgba(0,0,0,.08);padding:10px;display:flex;flex-direction:column}
svg{width:100%;height:auto;max-height:420px;background:#fafcff;border-radius:8px;border:1px solid #e5e7eb}
.ground{stroke:#94a3b8;stroke-width:2;stroke-dasharray:6 4}
.ground-label{font-size:11px;fill:#64748b}
.trajectory{fill:none;stroke:#94a3b8;stroke-width:2;stroke-dasharray:4 3}
.ball{fill:var(--accent);stroke:#fff;stroke-width:2}
.vector{stroke-width:3;marker-end:url(#arrow)}
.v{stroke:var(--v);color:var(--v)}
.a{stroke:var(--a);color:var(--a)}
.marker{opacity:.85}
.apex{fill:none;stroke:#9333ea;stroke-width:2}
.land{fill:#9333ea}
.marker-label{font-size:11px;fill:#9333ea}
.bar-label{font-size:10px;fill:#374151}
.bar{height:10px;rx:2}
.bar.k{fill:var(--k)}
.bar.p{fill:var(--p)}
.bar.m{fill:var(--m)}
.legend{display:flex;gap:14px;margin-top:8px;font-size:.85rem;align-items:center}
.dot{display:inline-block;width:14px;height:14px;border-radius:3px;margin-right:4px}
.dot.v{background:var(--v)}.dot.a{background:var(--a)}
.panel{flex:0 0 340px;background:var(--panel);border-radius:12px;box-shadow:0 1px 4px rgba(0,0,0,.08);padding:14px;display:flex;flex-direction:column;gap:14px}
.controls{display:grid;gap:10px}
label{display:grid;grid-template-columns:1fr auto auto;gap:6px;align-items:center;font-size:.9rem}
label>span{justify-self:end;min-width:3ch}
select,input[type=range]{width:100%}
input[type=range]{min-height:44px}
select{min-height:36px}
.btn{min-height:44px;padding:0 14px;border:0;border-radius:8px;background:var(--accent);color:#fff;font-size:.95rem;cursor:pointer;touch-action:manipulation}
.btn.secondary{background:#e5e7eb;color:var(--text)}
.playback{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
#scrub{flex:1 1 100%;min-height:44px}
.readouts{display:grid;gap:6px;font-size:.9rem}
.row{display:flex;justify-content:space-between;border-bottom:1px solid #f3f4f6;padding:3px 0}
.row b{font-weight:600}
@media(max-width:700px){
.wrap{flex-direction:column}
.panel{flex:auto;width:100%}
svg{max-height:320px}
}
</style>
</head>
<body>
<header>
<h1>平抛与斜抛运动纯物理模型</h1>
<p class="tip">调节参数后点击播放，观察位置、速度方向、加速度方向与能量的同步变化。</p>
</header>
<div class="wrap">
<section class="stage" aria-label="运动可视化">
<svg id="scene" viewBox="0 0 620 340" preserveAspectRatio="xMidYMid meet">
<defs>
<marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
<path d="M0,0 L9,3 L0,6 z" fill="currentColor"/>
</marker>
</defs>
<line class="ground" x1="10" y1="310" x2="610" y2="310"/>
<text class="ground-label" x="14" y="328">地面 y=0</text>
<path id="traj" class="trajectory" d=""/>
<line id="vel" class="vector v" x1="0" y1="0" x2="0" y2="0"/>
<line id="acc" class="vector a" x1="0" y1="0" x2="0" y2="0"/>
<circle id="ball" class="ball" r="7" cx="0" cy="0"/>
<circle id="apexM" class="marker apex" r="5" cx="-100" cy="-100"/>
<text id="apexL" class="marker-label" x="-100" y="-100">最高点</text>
<circle id="landM" class="marker land" r="4" cx="-100" cy="-100"/>
<text id="landL" class="marker-label" x="-100" y="-100">落地点</text>
<g id="energy" transform="translate(12,14)">
<text class="bar-label" x="0" y="10">动能</text>
<rect id="barK" class="bar k" x="0" y="14" width="0" height="10"/>
<text class="bar-label" x="0" y="38">势能</text>
<rect id="barP" class="bar p" x="0" y="42" width="0" height="10"/>
<text class="bar-label" x="0" y="66">机械能</text>
<rect id="barM" class="bar m" x="0" y="70" width="0" height="10"/>
</g>
</svg>
<div class="legend">
<span><span class="dot v"></span>速度 v</span>
<span><span class="dot a"></span>加速度/重力 a</span>
</div>
</section>
<aside class="panel">
<div class="controls">
<label>模式<select id="mode" data-control="mode"><option value="horizontal">平抛</option><option value="oblique">斜抛</option></select></label>
<label>高度 <span id="hVal">20</span>m<input id="height" type="range" min="1" max="60" step="1" value="20" data-control="height"></label>
<label>初速 <span id="vVal">10</span>m/s<input id="speed" type="range" min="1" max="40" step="1" value="10" data-control="speed"></label>
<label>角度 <span id="aVal">0</span>°<input id="angle" type="range" min="-75" max="75" step="1" value="0" data-control="angle" disabled></label>
<label>重力 <span id="gVal">10</span>m/s²<input id="gravity" type="range" min="1" max="20" step="0.5" value="10" data-control="gravity"></label>
<label>质量 <span id="mVal">1</span>kg<input id="mass" type="range" min="0.1" max="5" step="0.1" value="1" data-control="mass"></label>
</div>
<div class="playback">
<button id="play" class="btn">播放</button>
<button id="replay" class="btn secondary" data-replay>重放</button>
<button id="slow" class="btn secondary">慢放×<span id="rateVal">1</span></button>
<input id="scrub" type="range" min="0" max="1" step="0.001" value="0">
</div>
<div class="readouts">
<div class="row"><b>物理时间</b><span data-physical-time>0.00 s</span></div>
<div class="row"><b>演示时间</b><span data-demo-time>0.00 s</span></div>
<div class="row"><b>状态</b><span data-readout>准备</span></div>
<div class="row"><b>坐标</b><span id="pos">x=0.0 y=20.0</span></div>
<div class="row"><b>速度</b><span id="velMag">10.0 m/s</span></div>
<div class="row"><b>飞行时间</b><span id="flight">—</span></div>
<div class="row"><b>射程</b><span id="range">—</span></div>
<div class="row"><b>最大高度</b><span id="apexH">—</span></div>
<div class="row"><b>最佳等高地角</b><span id="optAng">—</span></div>
</div>
</aside>
</div>
<script>
(function(){const PI=Math.PI;globalThis.coursewareModel=Object.freeze({sample(input){const sc=(input&&input.scenario)||{};const mode=sc.mode||'oblique';const v0=+sc.speed_m_s||0;const thetaRad=((mode==='horizontal'?0:(+sc.angle_deg||0))*PI)/180;const g=+sc.g_m_s2||0;const m=+sc.mass_kg||0;const x0=+sc.x0_m||0;const y0=+sc.y0_m||0;const vx0=v0*Math.cos(thetaRad);const vy0=v0*Math.sin(thetaRad);const times=Array.isArray(input&&input.times_s)?input.times_s:[];let flightTime=0;if(g>0){flightTime=(vy0+Math.sqrt(vy0*vy0+2*g*y0))/g;}else{flightTime=Infinity;}const range=vx0*flightTime;let apexTime=0;if(g>0){apexTime=Math.max(0,vy0/g);}const maxHeight=y0+vy0*apexTime-0.5*g*apexTime*apexTime;const optAngle=(v0>0&&g>0)?45:0;const states=times.map(function(t){const tt=+t||0;let y=y0+vy0*tt-0.5*g*tt*tt;let vy=vy0-g*tt;let vx=vx0;let x=x0+vx0*tt;if(y<0){y=0;vy=vy0-g*flightTime;x=x0+vx0*flightTime;}const v2=vx*vx+vy*vy;const ke=0.5*m*v2;const pe=m*g*y;return{t_s:tt,x_m:x,y_m:y,vx_m_s:vx,vy_m_s:vy,ax_m_s2:0,ay_m_s2:-g,kinetic_j:ke,potential_j:pe,mechanical_j:ke+pe};});return{states:states,events:{flight_time_s:flightTime,range_m:range,apex_time_s:apexTime,max_height_m:maxHeight,optimal_equal_height_angle_deg:optAngle}};}});})();
</script>
<script>
"use strict";

globalThis.CoursewarePrimitives = Object.freeze({
  createTimeline(options) {
    const duration = Number(options.durationPhysicalS);
    const onChange = options.onChange;
    if (!Number.isFinite(duration) || duration <= 0 || typeof onChange !== "function") {
      throw new Error("invalid timeline options");
    }
    let physicalTime = 0;
    let demoRate = 0.5;
    let playing = false;
    let frame = 0;
    let previous = 0;
    const emit = () => onChange(Object.freeze({ physicalTimeS: physicalTime, demoRate, playing }));
    const tick = now => {
      if (!playing) return;
      if (!previous) previous = now;
      physicalTime = Math.min(duration, physicalTime + ((now - previous) / 1000) * demoRate);
      previous = now;
      emit();
      if (physicalTime >= duration) {
        playing = false;
        emit();
        return;
      }
      frame = requestAnimationFrame(tick);
    };
    return Object.freeze({
      play() {
        if (playing || physicalTime >= duration) return;
        playing = true;
        previous = 0;
        emit();
        frame = requestAnimationFrame(tick);
      },
      pause() {
        playing = false;
        cancelAnimationFrame(frame);
        emit();
      },
      replay() {
        playing = false;
        cancelAnimationFrame(frame);
        physicalTime = 0;
        previous = 0;
        emit();
      },
      seek(value) {
        physicalTime = Math.max(0, Math.min(duration, Number(value)));
        emit();
      },
      setDemoRate(value) {
        const next = Number(value);
        if (!Number.isFinite(next) || next < 0.1 || next > 4) throw new Error("invalid demo rate");
        demoRate = next;
        emit();
      },
      snapshot() { return Object.freeze({ physicalTimeS: physicalTime, demoRate, playing }); },
    });
  },
  formatPhysicalTime(value) { return `${Number(value).toFixed(2)} s（物理时间）`; },
  formatDemoRate(value) { return `${Number(value).toFixed(2)}×（演示倍率）`; },
});

</script>
<script>globalThis.__HARNESS_INPUT__=Object.freeze({"scenario":{"mode":"horizontal","g_m_s2":10.0,"mass_kg":1.0,"x0_m":0.0,"y0_m":20.0,"speed_m_s":10.0,"angle_deg":0.0},"times_s":[0.0,0.25,0.5,0.75,1.0,1.25,1.5,1.75,2.0]});</script>
<script>
const $=id=>document.getElementById(id);
const harnessInput=globalThis.__HARNESS_INPUT__||{};
let states=[],events={},totalT=0,rate=1,paused=true,prog=0,timeline=null,scale=1,barMax=1;
const mode=$('mode'),height=$('height'),speed=$('speed'),angle=$('angle'),gravity=$('gravity'),mass=$('mass');
const hVal=$('hVal'),vVal=$('vVal'),aVal=$('aVal'),gVal=$('gVal'),mVal=$('mVal');
const playBtn=$('play'),replayBtn=$('replay'),slowBtn=$('slow'),scrub=$('scrub'),rateVal=$('rateVal');
const physEl=document.querySelector('[data-physical-time]'),demoEl=document.querySelector('[data-demo-time]'),readEl=document.querySelector('[data-readout]');
const ball=$('ball'),vel=$('vel'),acc=$('acc'),traj=$('traj'),barK=$('barK'),barP=$('barP'),barM=$('barM');
const apexM=$('apexM'),apexL=$('apexL'),landM=$('landM'),landL=$('landL');
const rates=[1,0.5,0.25];
function fmt(n,d=2){return (n==null?'—':(+n).toFixed(d));}
function buildScenario(){return {mode:mode.value,x0_m:0,y0_m:+height.value,speed_m_s:+speed.value,angle_deg:mode.value==='horizontal'?0:+angle.value,g_m_s2:+gravity.value,mass_kg:+mass.value};}
function applyScenario(s){if(!s)return; mode.value=s.mode||'horizontal'; height.value=+s.y0_m||20; speed.value=+s.speed_m_s||10; angle.value=mode.value==='horizontal'?0:(+s.angle_deg||0); gravity.value=+s.g_m_s2||10; mass.value=+s.mass_kg||1; angle.disabled=mode.value==='horizontal'; updateLabels();}
function updateLabels(){hVal.textContent=height.value;vVal.textContent=speed.value;aVal.textContent=angle.value;gVal.textContent=gravity.value;mVal.textContent=mass.value;}
function findState(t){let lo=0,hi=states.length-1;while(lo<hi){let m=(lo+hi+1)>>1;if(states[m].t_s<=t)lo=m;else hi=m-1;}return states[lo];}
function computeScale(){let xm=0,ym=+height.value;states.forEach(s=>{if(s.x_m>xm)xm=s.x_m;if(s.y_m>ym)ym=s.y_m;});const sx=520/Math.max(xm,1),sy=260/Math.max(ym,10);scale=Math.min(sx,sy);}
function toSvg(s){return {x:30+s.x_m*scale,y:310-s.y_m*scale};}
function drawTrajectory(){let d='';states.forEach((s,i)=>{const p=toSvg(s);d+=(i?'L':'M')+p.x.toFixed(1)+','+p.y.toFixed(1)+' ';});traj.setAttribute('d',d);}
function placeMarkers(){function set(el,lab,x,y,show){if(show){el.setAttribute('cx',x);el.setAttribute('cy',y);lab.setAttribute('x',x+8);lab.setAttribute('y',y-8);lab.style.display='inline';}else{el.style.display='none';lab.style.display='none';}}const ax=events.apex_time_s>0&&events.max_height_m>+height.value?toSvg(findState(events.apex_time_s)):null;if(ax){set(apexM,apexL,ax.x,ax.y,true);}else{set(apexM,apexL,0,0,false);}const lx=events.range_m>0?30+events.range_m*scale:-100;landM.setAttribute('cx',lx);landM.setAttribute('cy',310);landL.setAttribute('x',lx+6);landL.setAttribute('y',300);landL.style.display=events.range_m>0?'inline':'none';}
function renderState(s){const p=toSvg(s);ball.setAttribute('cx',p.x);ball.setAttribute('cy',p.y);const vscale=3;vel.setAttribute('x1',p.x);vel.setAttribute('y1',p.y);vel.setAttribute('x2',p.x+s.vx_m_s*vscale);vel.setAttribute('y2',p.y-s.vy_m_s*vscale);const ascale=3;acc.setAttribute('x1',p.x);acc.setAttribute('y1',p.y);acc.setAttribute('x2',p.x+s.ax_m_s2*ascale);acc.setAttribute('y2',p.y-s.ay_m_s2*ascale);barK.setAttribute('width',Math.min(100,s.kinetic_j/barMax*100));barP.setAttribute('width',Math.min(100,s.potential_j/barMax*100));barM.setAttribute('width',Math.min(100,s.mechanical_j/barMax*100));$('pos').textContent='x='+fmt(s.x_m,1)+' y='+fmt(s.y_m,1);$('velMag').textContent=fmt(Math.hypot(s.vx_m_s,s.vy_m_s),1)+' m/s';const t=s.t_s;let st='飞行中';if(totalT>0&&Math.abs(t-totalT)<0.02)st='已落地';else if(events.apex_time_s>0&&Math.abs(t-events.apex_time_s)<0.03)st='最高点';readEl.textContent=st;physEl.textContent=fmt(t,2)+' s';demoEl.textContent=fmt(t/rate,2)+' s';}
function updateEvents(){$('flight').textContent=fmt(events.flight_time_s,2)+' s';$('range').textContent=fmt(events.range_m,2)+' m';$('apexH').textContent=fmt(events.max_height_m,2)+' m';$('optAng').textContent=fmt(events.optimal_equal_height_angle_deg,1)+'°';}
function setProgress(p){prog=Math.max(0,Math.min(1,p));scrub.value=prog;if(!states.length)return;const t=prog*totalT;const s=findState(t);renderState(s);}
function updatePlayBtn(){playBtn.textContent=paused?'播放':'暂停';}
function makeTimeline(duration,cb){let raf,last,p=0,pause=true;const tick=()=>{if(pause)return;const now=performance.now();p+=(now-last)/duration;last=now;if(p>=1){p=1;cb.onUpdate(p);pause=true;updatePlayBtn();if(cb.onComplete)cb.onComplete();return;}cb.onUpdate(p);raf=requestAnimationFrame(tick);};return {play(){if(!pause)return;pause=false;last=performance.now();if(cb.onPlay)cb.onPlay();tick();},pause(){if(pause)return;pause=true;cancelAnimationFrame(raf);if(cb.onPause)cb.onPause();},seek(v){p=Math.max(0,Math.min(1,v));cb.onUpdate(p);},getProgress(){return p;}};}
function createTimeline(){const duration=totalT>0?totalT*1000/rate:1;const cb={duration,onUpdate:setProgress,onComplete:()=>{paused=true;updatePlayBtn();readEl.textContent='已落地';},onPause:()=>{paused=true;updatePlayBtn();},onPlay:()=>{paused=false;updatePlayBtn();}};if(globalThis.CoursewarePrimitives&&CoursewarePrimitives.createTimeline){const tl=CoursewarePrimitives.createTimeline(cb);if(tl&&typeof tl.play==='function')return tl;}return makeTimeline(duration,cb);}
function resetTimeline(){if(timeline&&timeline.pause)timeline.pause();timeline=createTimeline();}
function resample(){const sc=buildScenario();const probe=coursewareModel.sample({scenario:sc,times_s:[0]});totalT=probe.events.flight_time_s||0;const n=400,times=[];for(let i=0;i<=n;i++)times.push(totalT*i/n);const result=coursewareModel.sample({scenario:sc,times_s:times});states=result.states;events=result.events;barMax=Math.max(...states.map(s=>s.mechanical_j||0),1);computeScale();drawTrajectory();placeMarkers();updateEvents();resetTimeline();setProgress(0);paused=true;updatePlayBtn();}
function playToggle(){if(paused){if(!timeline)resetTimeline();timeline.play();}else{timeline.pause();}}
function doReplay(){if(!timeline)resetTimeline();timeline.seek(0);timeline.play();}
function setRate(){const idx=(rates.indexOf(rate)+1)%rates.length;rate=rates[idx];rateVal.textContent=rate;const p=prog;resetTimeline();timeline.seek(p);}
playBtn.addEventListener('click',playToggle);
replayBtn.addEventListener('click',doReplay);
slowBtn.addEventListener('click',setRate);
scrub.addEventListener('input',()=>{if(timeline&&timeline.pause)timeline.pause();setProgress(+scrub.value);});
mode.addEventListener('change',()=>{angle.disabled=mode.value==='horizontal';if(mode.value==='horizontal')angle.value=0;updateLabels();resample();});
[height,speed,angle,gravity,mass].forEach(el=>el.addEventListener('input',()=>{updateLabels();resample();}));
document.addEventListener('visibilitychange',()=>{if(document.hidden&&timeline&&timeline.pause)timeline.pause();});
applyScenario(harnessInput.scenario);resample();
</script>
</body>
</html>
