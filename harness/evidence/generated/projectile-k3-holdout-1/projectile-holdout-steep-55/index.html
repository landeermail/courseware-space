<!DOCTYPE html>
<html lang="zh-CN">
<head><meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; img-src data: blob:; connect-src 'none'; object-src 'none'; frame-src 'none'; worker-src 'none'; media-src 'none'; font-src 'none'; form-action 'none'; base-uri 'none'">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>抛体运动纯物理模型</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:"PingFang SC","Microsoft YaHei",sans-serif;background:#10141d;color:#e8ecf4;min-height:100vh}
header{padding:14px 18px;background:#171d2a;border-bottom:1px solid #2a3347}
h1{font-size:20px}
header p{font-size:13px;color:#9aa7c0;margin-top:4px}
main{display:flex;gap:14px;padding:14px;flex-wrap:wrap}
.stage{flex:1 1 480px;background:#0b0e15;border:1px solid #2a3347;border-radius:12px;display:flex;flex-direction:column;overflow:hidden}
svg{width:100%;height:auto;min-height:340px;flex:1}
.legend{font-size:12px;color:#9aa7c0;display:flex;gap:14px;flex-wrap:wrap;padding:8px 12px;border-top:1px solid #2a3347}
.dot{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:4px;vertical-align:middle}
.panel{flex:0 1 320px;display:flex;flex-direction:column;gap:12px}
.card{background:#171d2a;border:1px solid #2a3347;border-radius:12px;padding:12px}
.card h2{font-size:14px;color:#9fb4dd;margin-bottom:6px}
label.ctl{display:block;margin:8px 0;font-size:13px}
label.ctl b{color:#ffd45e;float:right}
input[type=range]{width:100%;height:44px;accent-color:#f4a63b;cursor:pointer;touch-action:pan-y}
.btns{display:flex;gap:8px;flex-wrap:wrap}
button{min-height:44px;min-width:64px;padding:0 14px;border-radius:10px;border:1px solid #37425e;background:#222b3f;color:#e8ecf4;font-size:14px;cursor:pointer}
button.on{background:#f4a63b;color:#20160a;border-color:#f4a63b;font-weight:700}
.row{display:flex;justify-content:space-between;font-size:13px;padding:3px 0}
.row b{color:#ffd45e}
.times{display:flex;gap:10px;font-size:13px;flex-wrap:wrap;margin-top:4px}
.times span{background:#0b0e15;border:1px solid #2a3347;border-radius:8px;padding:6px 10px}
.times b{color:#ffd45e}
.bar{height:14px;background:#0b0e15;border-radius:7px;overflow:hidden;margin:4px 0 8px}
.bar i{display:block;height:100%;border-radius:7px;width:0}
#ro{font-size:13px;line-height:1.8;color:#cfe0ff}
@media(max-width:640px){main{flex-direction:column}.panel{flex:1 1 auto}svg{min-height:260px}}
</style>
</head>
<body>
<header><h1>抛体运动纯物理模型</h1><p>调节发射角、初速度与初始高度，拖动或慢放时间轴，观察最高点、射程、速度方向与能量转化之间的关系。</p></header>
<main>
<section class="stage">
<svg id="svg" preserveAspectRatio="xMidYMid meet" viewBox="-3 -40 60 40">
<defs>
<marker id="ah" markerUnits="userSpaceOnUse" markerWidth="3" markerHeight="3" refX="2.4" refY="1.5" orient="auto"><path d="M0,0 L3,1.5 L0,3 Z" fill="#e8556d"/></marker>
<marker id="ag" markerUnits="userSpaceOnUse" markerWidth="3" markerHeight="3" refX="2.4" refY="1.5" orient="auto"><path d="M0,0 L3,1.5 L0,3 Z" fill="#3aa0ff"/></marker>
</defs>
<line id="ground" x1="-3" y1="0" x2="60" y2="0" stroke="#4a5878" stroke-width="0.5"/>
<path id="traj" fill="none" stroke="#f4a63b" stroke-width="0.45" stroke-dasharray="1.2 1"/>
<circle id="launch" r="0.9" fill="#ffffff"/>
<circle id="apex" r="0.9" fill="#37c98d"/><text id="apexT" fill="#37c98d" font-size="2.4"></text>
<circle id="land" r="0.9" fill="#e8556d"/><text id="landT" fill="#e8556d" font-size="2.4"></text>
<line id="vel" stroke="#e8556d" stroke-width="0.6" marker-end="url(#ah)"/><text id="velT" fill="#e8556d" font-size="2.6">v</text>
<line id="acc" stroke="#3aa0ff" stroke-width="0.6" marker-end="url(#ag)"/><text id="accT" fill="#3aa0ff" font-size="2.6">g</text>
<circle id="ball" r="1.2" fill="#ffd45e" stroke="#7a5a00" stroke-width="0.3"/>
</svg>
<div class="legend"><span><i class="dot" style="background:#f4a63b"></i>轨迹</span><span><i class="dot" style="background:#e8556d"></i>速度 v（方向时刻变化）</span><span><i class="dot" style="background:#3aa0ff"></i>重力加速度 g（恒定向下）</span><span><i class="dot" style="background:#37c98d"></i>最高点</span></div>
</section>
<aside class="panel">
<div class="card"><h2>参数调节</h2>
<label class="ctl">发射角 θ<b id="vAngle">--</b><input id="cAngle" type="range" min="5" max="85" step="1" data-control="angle_deg"></label>
<label class="ctl">初速度 v₀<b id="vSpeed">--</b><input id="cSpeed" type="range" min="2" max="40" step="0.5" data-control="speed_m_s"></label>
<label class="ctl">初始高度 y₀<b id="vH">--</b><input id="cH" type="range" min="0" max="12" step="0.5" data-control="y0_m"></label>
</div>
<div class="card"><h2>播放控制</h2>
<div class="btns"><button id="btnPlay">暂停</button><button id="btnReplay" data-replay>↺ 回放</button></div>
<div class="btns" style="margin-top:8px"><button data-rate="0.5">0.5×</button><button data-rate="1" class="on">1×</button><button data-rate="2">2×</button><button data-rate="4">4×</button></div>
<input id="seek" type="range" min="0" max="1000" value="0" aria-label="时间轴拖动">
<div class="times"><span>物理时间 <b data-physical-time id="pt">--</b></span><span>演示倍率 <b data-demo-time id="dtm">--</b></span></div>
</div>
<div class="card"><h2>状态读数</h2><div id="ro" data-readout>--</div></div>
<div class="card"><h2>能量转化（机械能守恒）</h2>
<div class="row"><span>动能</span><b id="tK">--</b></div><div class="bar"><i id="bK" style="background:#e8556d"></i></div>
<div class="row"><span>重力势能</span><b id="tP">--</b></div><div class="bar"><i id="bP" style="background:#37c98d"></i></div>
<div class="row"><span>机械能</span><b id="tM">--</b></div><div class="bar"><i id="bM" style="background:#3aa0ff"></i></div>
</div>
<div class="card"><h2>本次飞行结果</h2>
<div class="row"><span>飞行时间</span><b id="evT">--</b></div>
<div class="row"><span>射程</span><b id="evR">--</b></div>
<div class="row"><span>最大高度</span><b id="evH">--</b></div>
<div class="row"><span>到达最高点时刻</span><b id="evA">--</b></div>
<div class="row"><span>等高最优角（参考）</span><b id="evO">--</b></div>
</div>
</aside>
</main>
<style>[data-control],[data-replay],button,select,input{min-height:44px}</style><script>
"use strict";

globalThis.CoursewarePrimitives = Object.freeze({
  createTimeline(options) {
    const duration = Number(options.durationPhysicalS);
    const onChange = options.onChange;
    if (!Number.isFinite(duration) || duration <= 0 || typeof onChange !== "function") {
      throw new Error("invalid timeline options");
    }
    let physicalTime = 0;
    let demoRate = 0.5;
    let playing = false;
    let frame = 0;
    let previous = 0;
    const emit = () => onChange(Object.freeze({ physicalTimeS: physicalTime, demoRate, playing }));
    const tick = now => {
      if (!playing) return;
      if (!previous) previous = now;
      physicalTime = Math.min(duration, physicalTime + ((now - previous) / 1000) * demoRate);
      previous = now;
      emit();
      if (physicalTime >= duration) {
        playing = false;
        emit();
        return;
      }
      frame = requestAnimationFrame(tick);
    };
    return Object.freeze({
      play() {
        if (playing || physicalTime >= duration) return;
        playing = true;
        previous = 0;
        emit();
        frame = requestAnimationFrame(tick);
      },
      pause() {
        playing = false;
        cancelAnimationFrame(frame);
        emit();
      },
      replay() {
        playing = false;
        cancelAnimationFrame(frame);
        physicalTime = 0;
        previous = 0;
        emit();
      },
      seek(value) {
        physicalTime = Math.max(0, Math.min(duration, Number(value)));
        emit();
      },
      setDemoRate(value) {
        const next = Number(value);
        if (!Number.isFinite(next) || next < 0.1 || next > 4) throw new Error("invalid demo rate");
        demoRate = next;
        emit();
      },
      snapshot() { return Object.freeze({ physicalTimeS: physicalTime, demoRate, playing }); },
    });
  },
  formatPhysicalTime(value) { return `${Number(value).toFixed(2)} s（物理时间）`; },
  formatDemoRate(value) { return `${Number(value).toFixed(2)}×（演示倍率）`; },
});

</script>
<script>
globalThis.coursewareModel=Object.freeze({sample(input){const sc=(input&&input.scenario)||{};const ts=(input&&Array.isArray(input.times_s))?input.times_s:[];const num=(v,d)=>{const n=Number(v);return Number.isFinite(n)?n:d;};const clean=n=>Object.is(n,-0)?0:n;const mode=String(sc.mode||'oblique').toLowerCase();const g=Math.max(1e-12,num(sc.g_m_s2,9.8));const m=num(sc.mass_kg,1);const x0=num(sc.x0_m,0);const y0=num(sc.y0_m,0);const speed=Math.max(0,num(sc.speed_m_s,0));const deg=mode==='horizontal'?0:num(sc.angle_deg,0);const rad=deg*Math.PI/180;const vx0=speed*Math.cos(rad);const vy0=speed*Math.sin(rad);const disc=Math.max(0,vy0*vy0+2*g*y0);const T=(vy0+Math.sqrt(disc))/g;const flight=Number.isFinite(T)&&T>0?T:0;const range=vx0*flight;const tApex=vy0>0?Math.min(vy0/g,flight):0;const maxH=y0+vy0*tApex-0.5*g*tApex*tApex;const states=ts.map(ti=>{const t=Math.max(0,num(ti,0));let x,y,vx,vy,ax,ay;if(t<=flight){x=x0+vx0*t;y=y0+vy0*t-0.5*g*t*t;if(y<0){y=0;}vx=vx0;vy=vy0-g*t;ax=0;ay=-g;}else{x=x0+range;y=0;vx=0;vy=0;ax=0;ay=0;}const ke=0.5*m*(vx*vx+vy*vy);const pe=m*g*y;return{t_s:clean(t),x_m:clean(x),y_m:clean(y),vx_m_s:clean(vx),vy_m_s:clean(vy),ax_m_s2:clean(ax),ay_m_s2:clean(ay),kinetic_j:clean(ke),potential_j:clean(pe),mechanical_j:clean(ke+pe)};});return{states,events:{flight_time_s:clean(flight),range_m:clean(range),apex_time_s:clean(tApex),max_height_m:clean(maxH),optimal_equal_height_angle_deg:45}};}});
</script>
<script>globalThis.__HARNESS_INPUT__=Object.freeze({"scenario":{"mode":"oblique","g_m_s2":9.8,"mass_kg":2.0,"x0_m":1.0,"y0_m":3.0,"speed_m_s":24.0,"angle_deg":55.0},"times_s":[0.0,0.5199212287823617,1.0398424575647234,1.5597636863470852,2.0796849151294468,2.5996061439118083,3.1195273726941704,3.639448601476532,4.1593698302588935]});</script>
<script>
(function(){
var H=globalThis.__HARNESS_INPUT__;
var scen={};Object.keys(H.scenario).forEach(function(k){scen[k]=H.scenario[k];});
var N=600,MAXT=30,traj=null,timeline=null,dur=1,drag=false,mx=60,my=40,mech0=1;
var $=function(id){return document.getElementById(id);};
var ball=$('ball'),vel=$('vel'),acc=$('acc'),velT=$('velT'),accT=$('accT');
function fmt(x,d){return Number(x).toFixed(d);}
function setC(c,x,y){c.setAttribute('cx',x);c.setAttribute('cy',y);}
function resample(){
  var times=[],i;
  for(i=0;i<=N;i++){times.push(i*MAXT/N);}
  traj=coursewareModel.sample({scenario:scen,times_s:times});
  dur=Math.max(traj.events.flight_time_s,0.01);
  mech0=Math.max(1e-9,traj.states[0].mechanical_j);
  layout();
  if(timeline){try{timeline.pause();}catch(e){}}
  timeline=CoursewarePrimitives.createTimeline({durationPhysicalS:dur,onChange:render});
  $('btnPlay').textContent='暂停';
  timeline.play();
}
function layout(){
  var ev=traj.events,st=traj.states,i,d='';
  mx=Math.max(ev.range_m,scen.x0_m+1)*1.08;
  my=Math.max(ev.max_height_m,scen.y0_m+0.5)*1.2;
  $('svg').setAttribute('viewBox',(-3)+' '+(-(my+2))+' '+(mx+7)+' '+(my+4));
  var g=$('ground');g.setAttribute('x2',mx+4);
  for(i=0;i<st.length;i++){d+=(i?'L':'M')+fmt(st[i].x_m,2)+' '+fmt(-st[i].y_m,2);}
  $('traj').setAttribute('d',d);
  var ia=Math.min(N,Math.max(0,Math.round(ev.apex_time_s/MAXT*N)));
  var a=st[ia];
  setC($('apex'),a.x_m,-a.y_m);
  var at=$('apexT');at.setAttribute('x',a.x_m+0.5);at.setAttribute('y',-a.y_m-0.6);
  at.textContent='最高点 '+fmt(ev.max_height_m,1)+' m';
  setC($('land'),ev.range_m,0);
  var lt=$('landT');lt.setAttribute('x',ev.range_m-2.5);lt.setAttribute('y',2.4);
  lt.textContent='射程 '+fmt(ev.range_m,1)+' m';
  setC($('launch'),scen.x0_m,-scen.y0_m);
  $('evT').textContent=fmt(ev.flight_time_s,2)+' s';
  $('evR').textContent=fmt(ev.range_m,2)+' m';
  $('evH').textContent=fmt(ev.max_height_m,2)+' m';
  $('evA').textContent=fmt(ev.apex_time_s,2)+' s';
  $('evO').textContent=fmt(ev.optimal_equal_height_angle_deg,1)+'°';
}
function render(state){
  var t=state.physicalTimeS;
  $('pt').textContent=CoursewarePrimitives.formatPhysicalTime(t);
  $('dtm').textContent=CoursewarePrimitives.formatDemoRate(state.demoRate);
  var i=Math.min(N,Math.max(0,Math.round(t/MAXT*N)));
  var s=traj.states[i];
  var md=Math.max(mx,my);
  setC(ball,s.x_m,-s.y_m);
  var k=md*0.22/Math.max(1,scen.speed_m_s);
  var ax=s.x_m+s.vx_m_s*k,ay=-s.y_m-s.vy_m_s*k;
  vel.setAttribute('x1',s.x_m);vel.setAttribute('y1',-s.y_m);
  vel.setAttribute('x2',ax);vel.setAttribute('y2',ay);
  velT.setAttribute('x',ax+0.4);velT.setAttribute('y',ay);
  var gl=md*0.15;
  acc.setAttribute('x1',s.x_m);acc.setAttribute('y1',-s.y_m);
  acc.setAttribute('x2',s.x_m);acc.setAttribute('y2',-s.y_m+gl);
  accT.setAttribute('x',s.x_m+0.4);accT.setAttribute('y',-s.y_m+gl);
  if(!drag){$('seek').value=Math.round(t/dur*1000);}
  var vmag=Math.sqrt(s.vx_m_s*s.vx_m_s+s.vy_m_s*s.vy_m_s);
  var ang=Math.atan2(s.vy_m_s,s.vx_m_s)*180/Math.PI;
  $('ro').innerHTML='位置：x='+fmt(s.x_m,2)+' m，y='+fmt(s.y_m,2)+' m<br>速度：vx='+fmt(s.vx_m_s,2)+' m/s，vy='+fmt(s.vy_m_s,2)+' m/s<br>速率 |v|='+fmt(vmag,2)+' m/s，速度方向角 '+fmt(ang,1)+'°<br>加速度：ax='+fmt(s.ax_m_s2,1)+'，ay='+fmt(s.ay_m_s2,1)+' m/s²（恒定）';
  $('bK').style.width=(s.kinetic_j/mech0*100)+'%';
  $('bP').style.width=(s.potential_j/mech0*100)+'%';
  $('bM').style.width=(s.mechanical_j/mech0*100)+'%';
  $('tK').textContent=fmt(s.kinetic_j,1)+' J';
  $('tP').textContent=fmt(s.potential_j,1)+' J';
  $('tM').textContent=fmt(s.mechanical_j,1)+' J';
  $('btnPlay').textContent=state.playing?'暂停':'播放';
}
function bind(id,key,vid,unit){
  var inp=$(id);
  inp.value=scen[key];
  $(vid).textContent=inp.value+unit;
  inp.addEventListener('input',function(){scen[key]=parseFloat(inp.value);$(vid).textContent=inp.value+unit;});
  inp.addEventListener('change',function(){resample();});
}
bind('cAngle','angle_deg','vAngle','°');
bind('cSpeed','speed_m_s','vSpeed',' m/s');
bind('cH','y0_m','vH',' m');
$('btnPlay').addEventListener('click',function(){
  if(!timeline){return;}
  if(this.textContent==='暂停'){timeline.pause();this.textContent='播放';}
  else{timeline.play();this.textContent='暂停';}
});
$('btnReplay').addEventListener('click',function(){if(timeline){timeline.replay();}});
document.querySelectorAll('[data-rate]').forEach(function(b){
  b.addEventListener('click',function(){
    if(timeline){timeline.setDemoRate(parseFloat(b.getAttribute('data-rate')));}
    document.querySelectorAll('[data-rate]').forEach(function(x){x.classList.remove('on');});
    b.classList.add('on');
  });
});
var sk=$('seek');
sk.addEventListener('pointerdown',function(){drag=true;});
sk.addEventListener('pointerup',function(){drag=false;});
sk.addEventListener('input',function(){if(timeline){timeline.seek(sk.value/1000*dur);}});
document.addEventListener('visibilitychange',function(){
  if(document.hidden&&timeline){timeline.pause();$('btnPlay').textContent='播放';}
});
resample();
})();
</script>
</body>
</html>
