<!doctype html><html lang='zh-CN'><head><meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; img-src data: blob:; connect-src 'none'; object-src 'none'; frame-src 'none'; worker-src 'none'; media-src 'none'; font-src 'none'; form-action 'none'; base-uri 'none'"><meta charset='utf-8'><meta name='viewport' content='width=device-width,initial-scale=1'><title>平抛与斜抛运动的分解与能量</title><style>[data-control],[data-replay],button,select,input{min-height:44px}</style><script>
"use strict";

globalThis.CoursewarePrimitives = Object.freeze({
  createTimeline(options) {
    const duration = Number(options.durationPhysicalS);
    const onChange = options.onChange;
    if (!Number.isFinite(duration) || duration <= 0 || typeof onChange !== "function") {
      throw new Error("invalid timeline options");
    }
    let physicalTime = 0;
    let demoRate = 0.5;
    let playing = false;
    let frame = 0;
    let previous = 0;
    const emit = () => onChange(Object.freeze({ physicalTimeS: physicalTime, demoRate, playing }));
    const tick = now => {
      if (!playing) return;
      if (!previous) previous = now;
      physicalTime = Math.min(duration, physicalTime + ((now - previous) / 1000) * demoRate);
      previous = now;
      emit();
      if (physicalTime >= duration) {
        playing = false;
        emit();
        return;
      }
      frame = requestAnimationFrame(tick);
    };
    return Object.freeze({
      play() {
        if (playing || physicalTime >= duration) return;
        playing = true;
        previous = 0;
        emit();
        frame = requestAnimationFrame(tick);
      },
      pause() {
        playing = false;
        cancelAnimationFrame(frame);
        emit();
      },
      replay() {
        playing = false;
        cancelAnimationFrame(frame);
        physicalTime = 0;
        previous = 0;
        emit();
      },
      seek(value) {
        physicalTime = Math.max(0, Math.min(duration, Number(value)));
        emit();
      },
      setDemoRate(value) {
        const next = Number(value);
        if (!Number.isFinite(next) || next < 0.1 || next > 4) throw new Error("invalid demo rate");
        demoRate = next;
        emit();
      },
      snapshot() { return Object.freeze({ physicalTimeS: physicalTime, demoRate, playing }); },
    });
  },
  formatPhysicalTime(value) { return `${Number(value).toFixed(2)} s（物理时间）`; },
  formatDemoRate(value) { return `${Number(value).toFixed(2)}×（演示倍率）`; },
});

</script><script>
globalThis.coursewareModel=Object.freeze({sample(input){const scenario=(input&&input.scenario)||{};const times=(input&&input.times_s)||[];function num(v,d){const n=Number(v);return Number.isFinite(n)?n:d;}const g=num(scenario.g_m_s2,9.8);const mass=num(scenario.mass_kg,1);const speed=Math.max(0,num(scenario.speed_m_s,0));const mode=String(scenario.mode||"horizontal");const angleDeg=mode==="horizontal"?0:num(scenario.angle_deg,0);const theta=angleDeg*Math.PI/180;const x0=num(scenario.x0_m,0);const y0=Math.max(0,num(scenario.y0_m,0));const vx0=speed*Math.cos(theta);const vy0=speed*Math.sin(theta);const disc=vy0*vy0+2*g*y0;let flight=0;if(g>0){flight=(vy0+Math.sqrt(Math.max(0,disc)))/g;}if(!Number.isFinite(flight)||flight<0){flight=0;}const states=Array.prototype.map.call(times,function(t){const tt=Math.max(0,num(t,0));const x=x0+vx0*tt;const yRaw=y0+vy0*tt-0.5*g*tt*tt;const y=yRaw>0?yRaw:0;const vx=vx0;const vy=vy0-g*tt;const ax=0;const ay=-g;const kinetic=0.5*mass*(vx*vx+vy*vy);const potential=mass*g*y;return {t_s:tt,x_m:x,y_m:y,vx_m_s:vx,vy_m_s:vy,ax_m_s2:ax,ay_m_s2:ay,kinetic_j:kinetic,potential_j:potential,mechanical_j:kinetic+potential};});const apex=vy0>0&&g>0?vy0/g:0;const maxHeight=vy0>0&&g>0?y0+vy0*vy0/(2*g):y0;return {states:states,events:{flight_time_s:flight,range_m:vx0*flight,apex_time_s:apex,max_height_m:maxHeight,optimal_equal_height_angle_deg:45}};}})
</script><script>globalThis.__HARNESS_INPUT__=Object.freeze({"scenario":{"mode":"horizontal","g_m_s2":9.8,"mass_kg":0.8,"x0_m":-3.0,"y0_m":30.0,"speed_m_s":12.0,"angle_deg":0.0},"times_s":[0.0,0.30929478706587094,0.6185895741317419,0.9278843611976129,1.2371791482634837,1.5464739353293546,1.8557687223952257,2.1650635094610964,2.4743582965269675]});</script><style>*{box-sizing:border-box}body{margin:0;font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;background:#0f172a;color:#e5e7eb}header{padding:12px 16px}h1{font-size:20px;margin:0 0 6px}p{margin:4px 0;color:#cbd5e1;font-size:13px}.wrap{display:grid;grid-template-columns:minmax(320px,1fr) 330px;gap:12px;padding:0 12px 14px}.card{background:#111827;border:1px solid #334155;border-radius:14px;padding:10px;min-width:0}svg{width:100%;height:auto;display:block;background:linear-gradient(#1e293b,#0b1220);border-radius:10px;touch-action:none}.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin:8px 0}label{font-size:13px;color:#dbeafe;display:flex;align-items:center;gap:6px}input[type=range]{width:150px;height:44px}button,select{min-height:44px;min-width:44px;border-radius:10px;border:1px solid #475569;background:#1f2937;color:#f8fafc;padding:8px 12px;font-size:14px}button:active{background:#334155}.read{font-variant-numeric:tabular-nums;background:#020617;border:1px solid #334155;border-radius:10px;padding:8px;margin:6px 0;font-size:13px;line-height:1.55}.big{font-size:18px;color:#a7f3d0}.tag{display:inline-block;background:#172554;color:#bfdbfe;border-radius:999px;padding:2px 8px;margin-right:4px;font-size:12px}.bars{display:grid;grid-template-columns:64px 1fr 54px;gap:6px;align-items:center;font-size:12px}.bar{height:12px;background:#334155;border-radius:99px;overflow:hidden}.bar i{display:block;height:100%;width:0;background:#f59e0b}.ke i{background:#22c55e}.pe i{background:#38bdf8}.me i{background:#a78bfa}@media(max-width:760px){.wrap{grid-template-columns:1fr}header{padding:10px 12px}input[type=range]{flex:1;min-width:150px}}</style></head><body><header><h1>平抛运动的分解与能量</h1><p>核心因果：抛出后水平不受力，竖直只受重力；两方向共用同一个物理时钟。拖动时间轴，观察速度箭头、能量条与落点的同步变化。</p></header><main class='wrap'><section class='card'><div class='row'><span class='tag'>物理时间</span><span class='big' data-physical-time>--</span><span class='tag'>演示倍率</span><span class='big' data-demo-time>--</span></div><svg id='stage' viewBox='0 0 640 360' role='img' aria-label='平抛轨迹动画'><line x1='0' y1='320' x2='640' y2='320' stroke='#94a3b8' stroke-width='3'/><path id='path' fill='none' stroke='#f8fafc' stroke-width='2' stroke-dasharray='5 5' opacity='.75'/><line id='vx' stroke='#22c55e' stroke-width='4' stroke-linecap='round'/><line id='vy' stroke='#38bdf8' stroke-width='4' stroke-linecap='round'/><line id='ac' stroke='#ef4444' stroke-width='4' stroke-linecap='round'/><circle id='ball' r='9' fill='#fde047' stroke='#111827' stroke-width='2'/><text x='18' y='28' fill='#cbd5e1' font-size='13'>绿:水平速度 蓝:竖直速度 红:加速度/重力方向</text></svg><div class='row'><button id='play'>播放</button><button id='pause'>暂停</button><button data-replay id='replay'>回到 0 并播放</button><button class='rate' data-v='0.5'>慢放0.5×</button><button class='rate' data-v='1'>1×</button><button class='rate' data-v='2'>2×</button></div><div class='read' data-readout>等待模型采样…</div></section><aside class='card'><h2 style='font-size:16px;margin:0 0 8px'>可调条件</h2><div class='row'><label>初速度 <span id='spv'></span> m/s<input id='sp' data-control type='range' min='4' max='24' step='0.5'></label></div><div class='row'><label>平台高 <span id='hv'></span> m<input id='h' data-control type='range' min='12' max='50' step='1'></label></div><div class='row'><label>重力g <span id='gv'></span> m/s²<input id='g' data-control type='range' min='3.7' max='24.8' step='0.1'></label></div><div class='read'>事件：<span id='ev'>--</span></div><h2 style='font-size:16px;margin:10px 0 8px'>能量同步</h2><div class='bars ke'><span>动能</span><div class='bar'><i id='bke'></i></div><b id='nke'>--</b></div><div class='bars pe'><span>势能</span><div class='bar'><i id='bpe'></i></div><b id='npe'>--</b></div><div class='bars me'><span>机械能</span><div class='bar'><i id='bme'></i></div><b id='nme'>--</b></div><p>提示：只改高度时，水平速度不变，但共用飞行时间变长，落点随之改变。</p></aside></main><script>let H=globalThis.__HARNESS_INPUT__;if(typeof H==='string'){try{H=JSON.parse(H)}catch(e){}}let base=(H&&H.scenario)?H.scenario:{angle_deg:0,g_m_s2:9.8,mass_kg:0.8,mode:'horizontal',speed_m_s:12,x0_m:-3,y0_m:30};const $=id=>document.getElementById(id);let states=[],events={},flight=6,tl=null,last=null,scale={sx:1,sy:1,ox:0,ymax:1};function num(id){return parseFloat($(id).value)}function showLabels(){$('spv').textContent=num('sp').toFixed(1);$('hv').textContent=num('h').toFixed(0);$('gv').textContent=num('g').toFixed(1)}function scenario(){return{mode:'horizontal',angle_deg:0,mass_kg:base.mass_kg||0.8,x0_m:(base.x0_m===undefined?-3:base.x0_m),y0_m:num('h'),speed_m_s:num('sp'),g_m_s2:num('g')}}function axis(n,a,b){let r=[];for(let i=0;i<n;i++){r.push(a+(b-a)*i/(n-1))}return r}function prep(){let xs=states.map(s=>s.x_m),ys=states.map(s=>s.y_m);let x0=Math.min.apply(null,xs),x1=Math.max.apply(null,xs.concat(events.range_m||0));let y1=Math.max.apply(null,ys.concat(events.max_height_m||0,1));scale={sx:560/Math.max(1,x1-x0),sy:270/Math.max(1,y1),ox:35-x0*560/Math.max(1,x1-x0),ymax:y1}}function X(x){return scale.ox+x*scale.sx}function Y(y){return 320-y*scale.sy}function near(t){let s=states[0],d=Math.abs(t-s.t_s);for(let i=1;i<states.length;i++){let q=Math.abs(t-states[i].t_s);if(q<d){d=q;s=states[i]}}return s}function fmt(v){return(Math.round(v*100)/100).toString()}function draw(t){if(!states.length)return;let s=near(t),bx=X(s.x_m),by=Y(s.y_m);$('ball').setAttribute('cx',bx);$('ball').setAttribute('cy',by);$('path').setAttribute('d',states.map((p,i)=>(i?'L':'M')+fmt(X(p.x_m))+' '+fmt(Y(p.y_m))).join(' '));let vs=5.5;$('vx').setAttribute('x1',bx);$('vx').setAttribute('y1',by);$('vx').setAttribute('x2',bx+s.vx_m_s*vs);$('vx').setAttribute('y2',by);$('vy').setAttribute('x1',bx);$('vy').setAttribute('y1',by);$('vy').setAttribute('x2',bx);$('vy').setAttribute('y2',by-s.vy_m_s*vs);$('ac').setAttribute('x1',bx+18);$('ac').setAttribute('y1',by);$('ac').setAttribute('x2',bx+18);$('ac').setAttribute('y2',by+38);let m=Math.max(1,s.mechanical_j);$('bke').style.width=(100*s.kinetic_j/m)+'%';$('bpe').style.width=(100*s.potential_j/m)+'%';$('bme').style.width='100%';$('nke').textContent=fmt(s.kinetic_j);$('npe').textContent=fmt(s.potential_j);$('nme').textContent=fmt(s.mechanical_j);document.querySelector('[data-readout]').innerHTML=`分量同时发生：<b>x=${fmt(s.x_m)} m</b>，<b>y=${fmt(s.y_m)} m</b><br>vx=${fmt(s.vx_m_s)} m/s（近似恒定），vy=${fmt(s.vy_m_s)} m/s（随时间变化）<br>ax=${fmt(s.ax_m_s2)}，ay=${fmt(s.ay_m_s2)} m/s²：加速度指向地面`}function setTime(st){last=st;document.querySelector('[data-physical-time]').textContent=CoursewarePrimitives.formatPhysicalTime(st.physicalTimeS);document.querySelector('[data-demo-time]').textContent=CoursewarePrimitives.formatDemoRate(st.demoRate);draw(st.physicalTimeS)}function makeT(d){if(tl)tl.pause();tl=CoursewarePrimitives.createTimeline({durationPhysicalS:Math.max(0.5,d),onChange:setTime});tl.seek(0)}function resample(){showLabels();let sc=scenario();let out=coursewareModel.sample({scenario:sc,times_s:axis(241,0,Math.max(6,flight))});if(out.events&&out.events.flight_time_s){flight=Math.max(0.5,out.events.flight_time_s);out=coursewareModel.sample({scenario:sc,times_s:axis(241,0,flight)})}states=out.states||[];events=out.events||{};prep();makeT(flight);$('ev').textContent=`飞行 ${fmt(events.flight_time_s||0)} s，射程 ${fmt(events.range_m||0)} m，最高点 ${fmt(events.max_height_m||0)} m`;draw(last?last.physicalTimeS:0)}['sp','h','g'].forEach(id=>$(id).addEventListener('input',resample));$('play').onclick=()=>tl&&tl.play();$('pause').onclick=()=>tl&&tl.pause();$('replay').onclick=()=>tl&&tl.replay();document.querySelectorAll('.rate').forEach(b=>b.onclick=()=>tl&&tl.setDemoRate(parseFloat(b.dataset.v)));document.addEventListener('visibilitychange',()=>{if(document.hidden&&tl)tl.pause()});showLabels();resample();</script></body></html>
