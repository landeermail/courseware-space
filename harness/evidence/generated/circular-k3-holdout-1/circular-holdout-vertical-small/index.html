<body>
<style>[data-control],[data-replay],button,select,input{min-height:44px}</style><script>
"use strict";

globalThis.CoursewarePrimitives = Object.freeze({
  createTimeline(options) {
    const duration = Number(options.durationPhysicalS);
    const onChange = options.onChange;
    if (!Number.isFinite(duration) || duration <= 0 || typeof onChange !== "function") {
      throw new Error("invalid timeline options");
    }
    let physicalTime = 0;
    let demoRate = 0.5;
    let playing = false;
    let frame = 0;
    let previous = 0;
    const emit = () => {
      if (typeof document !== "undefined" && document.documentElement) {
        document.documentElement.setAttribute("data-harness-physical-time", physicalTime.toFixed(6));
        document.documentElement.setAttribute("data-harness-playing", playing ? "true" : "false");
      }
      onChange(Object.freeze({ physicalTimeS: physicalTime, demoRate, playing }));
    };
    const tick = now => {
      if (!playing) return;
      if (!previous) previous = now;
      physicalTime = Math.min(duration, physicalTime + ((now - previous) / 1000) * demoRate);
      previous = now;
      emit();
      if (physicalTime >= duration) {
        playing = false;
        emit();
        return;
      }
      frame = requestAnimationFrame(tick);
    };
    const controller = Object.freeze({
      play() {
        if (playing || physicalTime >= duration) return;
        playing = true;
        previous = 0;
        emit();
        frame = requestAnimationFrame(tick);
      },
      pause() {
        playing = false;
        cancelAnimationFrame(frame);
        emit();
      },
      replay() {
        playing = false;
        cancelAnimationFrame(frame);
        physicalTime = 0;
        previous = 0;
        emit();
      },
      seek(value) {
        physicalTime = Math.max(0, Math.min(duration, Number(value)));
        emit();
      },
      setDemoRate(value) {
        const next = Number(value);
        if (!Number.isFinite(next) || next < 0.1 || next > 4) throw new Error("invalid demo rate");
        demoRate = next;
        emit();
      },
      snapshot() { return Object.freeze({ physicalTimeS: physicalTime, demoRate, playing }); },
    });
    emit();
    return controller;
  },
  formatPhysicalTime(value) { return `${Number(value).toFixed(2)} s（物理时间）`; },
  formatDemoRate(value) { return `${Number(value).toFixed(2)}×（演示倍率）`; },
});

</script>
<script>
(()=>{"use strict";const TAU=2*Math.PI;function finiteNumber(value,name){if(typeof value!=="number"||!Number.isFinite(value)){throw new Error(name+" must be a finite number");}return value;}function positiveNumber(value,name){const result=finiteNumber(value,name);if(result<=0){throw new Error(name+" must be positive");}return result;}function buildState(angle,x,y,speed,ax,ay,radialForce,tension,potential,mass){const kinetic=0.5*mass*speed*speed;return{angle_rad:angle,x_m:x,y_m:y,speed_m_s:speed,ax_m_s2:ax,ay_m_s2:ay,radial_force_n:radialForce,tension_n:tension,kinetic_j:kinetic,potential_j:potential,mechanical_j:kinetic+potential};}globalThis.coursewareModel=Object.freeze({sample(input){if(!input||typeof input!=="object"){throw new Error("input must be an object");}const scenario=input.scenario;if(!scenario||typeof scenario!=="object"){throw new Error("input.scenario must be an object");}if(!Array.isArray(input.angles_rad)){throw new Error("input.angles_rad must be an array");}const angles=input.angles_rad.map((angle,index)=>finiteNumber(angle,"angles_rad["+index+"]"));const mode=scenario.mode;const mass=positiveNumber(scenario.mass_kg,"mass_kg");const radius=positiveNumber(scenario.radius_m,"radius_m");if(mode==="vertical_string"){const g=positiveNumber(scenario.g_m_s2,"g_m_s2");const bottomSpeed=positiveNumber(scenario.speed_m_s,"speed_m_s");const bottomSpeedSquared=bottomSpeed*bottomSpeed;const topSpeedSquared=bottomSpeedSquared-4*g*radius;if(!(topSpeedSquared>0)){throw new Error("speed_m_s is insufficient to complete the vertical circle");}const speedSquaredAt=angle=>bottomSpeedSquared-2*g*radius*(1-Math.cos(angle));const states=angles.map(angle=>{const speedSquared=speedSquaredAt(angle);if(!(speedSquared>0)){throw new Error("speed becomes non-positive at the requested angle");}const speed=Math.sqrt(speedSquared);const centripetal=speedSquared/radius;const x=radius*Math.sin(angle);const y=radius*(1-Math.cos(angle));const ax=-centripetal*Math.sin(angle);const ay=centripetal*Math.cos(angle);const radialForce=mass*centripetal;const tension=mass*(centripetal+g*Math.cos(angle));const potential=mass*g*y;return buildState(angle,x,y,speed,ax,ay,radialForce,tension,potential,mass);});const intervals=32768;const step=TAU/intervals;const integrand=theta=>radius/Math.sqrt(speedSquaredAt(theta));let integral=integrand(0)+integrand(TAU);for(let i=1;i<intervals;i+=1){integral+=(i%2===1?4:2)*integrand(i*step);}const period=integral*step/3;return{states,events:{period_s:period,centripetal_acceleration_m_s2:bottomSpeedSquared/radius,critical_top_speed_m_s:Math.sqrt(g*radius),critical_bottom_speed_m_s:Math.sqrt(5*g*radius)}};}if(mode==="uniform"){const speed=positiveNumber(scenario.speed_m_s,"speed_m_s");const centripetal=speed*speed/radius;const radialForce=mass*centripetal;const states=angles.map(angle=>{const x=radius*Math.cos(angle);const y=radius*Math.sin(angle);return buildState(angle,x,y,speed,-centripetal*Math.cos(angle),-centripetal*Math.sin(angle),radialForce,radialForce,0,mass);});return{states,events:{period_s:TAU*radius/speed,centripetal_acceleration_m_s2:centripetal}};}if(mode==="orbit"){const gravitationalConstant=positiveNumber(scenario.G_n_m2_kg2,"G_n_m2_kg2");const centralMass=positiveNumber(scenario.central_mass_kg,"central_mass_kg");const speed=Math.sqrt(gravitationalConstant*centralMass/radius);const centripetal=speed*speed/radius;const radialForce=gravitationalConstant*centralMass*mass/(radius*radius);const potential=-gravitationalConstant*centralMass*mass/radius;const states=angles.map(angle=>{const x=radius*Math.cos(angle);const y=radius*Math.sin(angle);return buildState(angle,x,y,speed,-centripetal*Math.cos(angle),-centripetal*Math.sin(angle),radialForce,0,potential,mass);});return{states,events:{period_s:TAU*Math.sqrt(radius*radius*radius/(gravitationalConstant*centralMass)),centripetal_acceleration_m_s2:centripetal}};}throw new Error("mode must be uniform, orbit, or vertical_string");}});})();
</script>
<script>globalThis.__HARNESS_INPUT__=Object.freeze({"scenario":{"mode":"vertical_string","mass_kg":0.3,"radius_m":1.2,"g_m_s2":10.0,"speed_m_s":9.0,"central_mass_kg":0.0,"G_n_m2_kg2":6.6743e-11},"angles_rad":[0.0,0.7853981633974483,1.5707963267948966,2.356194490192345,3.141592653589793,3.9269908169872414,4.71238898038469,5.497787143782138,6.283185307179586]});</script><script>
(()=>{
  const root=document.documentElement;
  const short=value=>String(value&&value.message||value||'unknown runtime error').slice(0,500);
  addEventListener('error',event=>root.setAttribute('data-harness-runtime-error',short(event.error||event.message)),true);
  addEventListener('unhandledrejection',event=>root.setAttribute('data-harness-runtime-error',short(event.reason)),true);
  const expected=globalThis.__HARNESS_INPUT__.scenario;
  const original=globalThis.coursewareModel;
  let calls=0;
  const same=(left,right)=>{
    if(left===right)return true;
    if(!left||!right||typeof left!=='object'||typeof right!=='object')return false;
    const leftKeys=Object.keys(left).sort(),rightKeys=Object.keys(right).sort();
    return leftKeys.length===rightKeys.length&&leftKeys.every((key,index)=>key===rightKeys[index]&&same(left[key],right[key]));
  };
  const guarded=Object.freeze({sample(input){
    calls+=1;
    root.setAttribute('data-harness-sample-count',String(calls));
    if(calls===1){
      const matched=Boolean(input&&same(input.scenario,expected));
      root.setAttribute('data-harness-initial-scenario',matched?'matched':'mismatched');
      if(!matched)throw new Error('首次采样场景与老师确认题设不一致');
    }
    return original.sample(input);
  }});
  Object.defineProperty(globalThis,'coursewareModel',{value:guarded,writable:false,configurable:false});
})();
</script>
<header><h1>通用圆周运动与竖直绳圆周模型</h1><div class="sub">竖直绳圆周：速率随高度变化，张力在最高点最小——重点观察最高点张力余量</div></header>
<main>
<section class="stage">
<svg viewBox="-200 -200 400 400" aria-label="竖直圆周运动示意">
<defs>
<marker id="mV" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 10 5 0 10z" fill="#59d99e"/></marker>
<marker id="mT" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 10 5 0 10z" fill="#ff7b72"/></marker>
<marker id="mA" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 10 5 0 10z" fill="#ffb454"/></marker>
</defs>
<circle cx="0" cy="0" r="100" fill="none" stroke="#3b4a6b" stroke-width="2" stroke-dasharray="6 6"/>
<text x="0" y="-112" text-anchor="middle" fill="#ffd479" font-size="13">最高点</text>
<text x="0" y="126" text-anchor="middle" fill="#9db1d1" font-size="13">最低点 θ=0</text>
<circle cx="0" cy="0" r="4" fill="#8fd0ff"/>
<line id="rope" x1="0" y1="0" x2="0" y2="100" stroke="#cfd8ea" stroke-width="3"/>
<line id="vVec" x1="0" y1="100" x2="0" y2="100" stroke="#59d99e" stroke-width="3" marker-end="url(#mV)"/>
<line id="tVec" x1="0" y1="100" x2="0" y2="100" stroke="#ff7b72" stroke-width="3" marker-end="url(#mT)"/>
<line id="aVec" x1="0" y1="100" x2="0" y2="100" stroke="#ffb454" stroke-width="3" marker-end="url(#mA)"/>
<circle id="ball" cx="0" cy="100" r="12" fill="#4da3ff" stroke="#dff0ff" stroke-width="2"/>
</svg>
<div class="legend">绿箭头＝速度（切向）　红箭头＝绳张力（指向圆心）　橙箭头＝加速度。拖到最高点附近慢放，看红箭头还剩多长。</div>
</section>
<aside class="panel">
<div class="card"><h2>参数调节</h2>
<div class="ctl"><label><span>最低点速度 v₀</span><span id="labSpeed"></span></label><input id="ctlSpeed" data-control="speed_m_s" type="range" min="5" max="15" step="0.1"></div>
<div class="ctl"><label><span>小球质量 m</span><span id="labMass"></span></label><input id="ctlMass" data-control="mass_kg" type="range" min="0.1" max="1" step="0.05"></div>
<div class="ctl"><label><span>绳长（半径）r</span><span id="labRadius"></span></label><input id="ctlRadius" data-control="radius_m" type="range" min="0.5" max="2" step="0.05"></div>
</div>
<div class="card"><h2>时间控制</h2>
<div class="row"><button id="btnPlay" type="button">播放</button><button id="btnReplay" type="button" data-replay>重新播放</button></div>
<div class="row" style="margin-top:8px">
<button class="rate" type="button" data-rate="0.25">0.25×</button>
<button class="rate" type="button" data-rate="0.5">0.5×</button>
<button class="rate on" type="button" data-rate="1">1×</button>
<button class="rate" type="button" data-rate="2">2×</button>
<button class="rate" type="button" data-rate="4">4×</button>
</div>
<div class="kv"><span>物理时间</span><span id="physTime" data-physical-time>—</span></div>
<div class="kv"><span>演示倍率</span><span id="demoTime" data-demo-time>—</span></div>
<div class="kv"><span>周期（按 v(θ) 数值积分）</span><span id="periodInfo">—</span></div>
</div>
<div class="card" data-readout><h2>状态读数</h2>
<div class="kv"><span>位置角度 θ（最低点为 0°）</span><span id="roAng">—</span></div>
<div class="kv"><span>速率 v</span><span id="roV">—</span></div>
<div class="kv"><span>加速度大小 a</span><span id="roA">—</span></div>
<div class="kv"><span>绳张力 T</span><span id="roT">—</span></div>
<h2 style="margin-top:10px">最高点余量</h2>
<div class="kv"><span>最高点速率</span><span id="topV">—</span></div>
<div class="kv"><span>最高点张力（即余量）</span><span id="topT">—</span></div>
<div class="top" id="critInfo"></div>
</div>
<div class="card"><h2>能量</h2>
<div class="kv"><span>动能</span><span id="keVal">—</span></div><div class="bar"><i id="keBar" style="background:#59d99e;width:0"></i></div>
<div class="kv"><span>重力势能</span><span id="peVal">—</span></div><div class="bar"><i id="peBar" style="background:#4da3ff;width:0"></i></div>
<div class="kv"><span>机械能（守恒）</span><span id="meVal">—</span></div><div class="bar"><i id="meBar" style="background:#ffd479;width:0"></i></div>
</div>
</aside>
</main>
<script>
"use strict";
var H=globalThis.__HARNESS_INPUT__;
var base=H.scenario;
var $=function(id){return document.getElementById(id);};
var N=720;
var angles=[];
for(var i=0;i<=N;i++){angles.push(2*Math.PI*i/N);}
var scen=base,sample=null,times=[],period=1,timeline=null,playing=false;
var maxKE=1,maxPE=1,maxME=1;
var ctlS=$("ctlSpeed"),ctlM=$("ctlMass"),ctlR=$("ctlRadius");
function updLabels(){
 $("labSpeed").textContent=Number(ctlS.value).toFixed(1)+" m/s";
 $("labMass").textContent=Number(ctlM.value).toFixed(2)+" kg";
 $("labRadius").textContent=Number(ctlR.value).toFixed(2)+" m";
}
function scenFromControls(){
 return {G_n_m2_kg2:base.G_n_m2_kg2,central_mass_kg:base.central_mass_kg,g_m_s2:base.g_m_s2,mass_kg:Number(ctlM.value),mode:base.mode,radius_m:Number(ctlR.value),speed_m_s:Number(ctlS.value)};
}
function buildTimeMap(){
 var st=sample.states,r=scen.radius_m;
 times=[0];
 for(var i=0;i<N;i++){
  var v=(st[i].speed_m_s+st[i+1].speed_m_s)/2;
  times.push(times[i]+r*(angles[i+1]-angles[i])/Math.max(v,1e-6));
 }
 var k=period/times[N];
 for(var j=0;j<=N;j++){times[j]*=k;}
}
function stats(){
 maxKE=0;maxPE=0;maxME=0;
 sample.states.forEach(function(s){
  if(s.kinetic_j>maxKE)maxKE=s.kinetic_j;
  if(s.potential_j>maxPE)maxPE=s.potential_j;
  if(s.mechanical_j>maxME)maxME=s.mechanical_j;
 });
 if(maxKE<=0)maxKE=1;
 if(maxPE<=0)maxPE=1;
 if(maxME<=0)maxME=1;
}
function stateAt(t){
 var st=sample.states;
 var tau=t%period;
 if(tau<0)tau+=period;
 var lo=0,hi=N;
 while(hi-lo>1){var m=(lo+hi)>>1; if(times[m]<=tau)lo=m; else hi=m;}
 var t0=times[lo],t1=times[hi];
 var f=t1>t0?(tau-t0)/(t1-t0):0;
 var a=st[lo],b=st[hi];
 function L(x,y){return x+(y-x)*f;}
 return {ang:L(a.angle_rad,b.angle_rad),x:L(a.x_m,b.x_m),y:L(a.y_m,b.y_m),v:L(a.speed_m_s,b.speed_m_s),ax:L(a.ax_m_s2,b.ax_m_s2),ay:L(a.ay_m_s2,b.ay_m_s2),T:L(a.tension_n,b.tension_n),ke:L(a.kinetic_j,b.kinetic_j),pe:L(a.potential_j,b.potential_j),me:L(a.mechanical_j,b.mechanical_j)};
}
function cap(x,y,m){var l=Math.hypot(x,y); if(l>m&&l>0){return [x*m/l,y*m/l];} return [x,y];}
function setL(el,x1,y1,x2,y2){el.setAttribute("x1",x1);el.setAttribute("y1",y1);el.setAttribute("x2",x2);el.setAttribute("y2",y2);}
function draw(s){
 var sc=100/scen.radius_m;
 var bx=s.x*sc,by=-s.y*sc;
 var ball=$("ball");
 ball.setAttribute("cx",bx);ball.setAttribute("cy",by);
 setL($("rope"),0,0,bx,by);
 var c=Math.cos(s.ang),sn=Math.sin(s.ang);
 var vl=cap(c*s.v*7,-sn*s.v*7,85);
 setL($("vVec"),bx,by,bx+vl[0],by+vl[1]);
 var tn=Math.hypot(bx,by)||1;
 var td=cap(-bx/tn*s.T*4,-by/tn*s.T*4,90);
 setL($("tVec"),bx,by,bx+td[0],by+td[1]);
 var ad=cap(s.ax,-s.ay,90);
 setL($("aVec"),bx,by,bx+ad[0],by+ad[1]);
 var deg=((s.ang*180/Math.PI)%360+360)%360;
 $("roAng").textContent=deg.toFixed(0)+"°";
 $("roV").textContent=s.v.toFixed(2)+" m/s";
 $("roT").textContent=s.T.toFixed(2)+" N";
 $("roA").textContent=Math.hypot(s.ax,s.ay).toFixed(1)+" m/s²";
 $("keBar").style.width=(s.ke/maxKE*100)+"%";
 $("peBar").style.width=(s.pe/maxPE*100)+"%";
 $("meBar").style.width=(s.me/maxME*100)+"%";
 $("keVal").textContent=s.ke.toFixed(2)+" J";
 $("peVal").textContent=s.pe.toFixed(2)+" J";
 $("meVal").textContent=s.me.toFixed(2)+" J";
}
function render(st){
 $("physTime").textContent=CoursewarePrimitives.formatPhysicalTime(st.physicalTimeS);
 $("demoTime").textContent=CoursewarePrimitives.formatDemoRate(st.demoRate);
 playing=!!st.playing;
 $("btnPlay").textContent=playing?"暂停":"播放";
 draw(stateAt(st.physicalTimeS));
}
function topInfo(){
 var st=sample.states[N/2];
 $("topV").textContent=st.speed_m_s.toFixed(2)+" m/s";
 $("topT").textContent=st.tension_n.toFixed(2)+" N";
 var ev=sample.events;
 $("periodInfo").textContent=ev.period_s.toFixed(3)+" s";
 var msg="";
 if(ev.critical_bottom_speed_m_s!==undefined){
  msg="恰好完成整周所需：最低点临界速度 "+ev.critical_bottom_speed_m_s.toFixed(2)+" m/s，最高点临界速度 "+ev.critical_top_speed_m_s.toFixed(2)+" m/s。";
 }
 if(st.tension_n>0.05){msg+=" 当前最高点张力大于 0，绳子保持绷紧，余量充足。";}
 else{msg+=" 当前最高点张力接近 0，绳子接近松弛，处于临界附近。";}
 $("critInfo").textContent=msg;
}
function resample(first){
 scen=first?base:scenFromControls();
 sample=coursewareModel.sample({scenario:scen,angles_rad:angles});
 period=sample.events.period_s;
 buildTimeMap();
 stats();
 if(timeline){timeline.pause();}
 timeline=CoursewarePrimitives.createTimeline({durationPhysicalS:period,onChange:function(st){render(st);}});
 topInfo();
 render({physicalTimeS:0,demoRate:1,playing:false});
}
ctlS.value=base.speed_m_s;
ctlM.value=base.mass_kg;
ctlR.value=base.radius_m;
updLabels();
[ctlS,ctlM,ctlR].forEach(function(el){el.addEventListener("input",function(){updLabels();resample(false);});});
$("btnPlay").addEventListener("click",function(){if(!timeline)return; if(playing){timeline.pause();}else{timeline.play();}});
$("btnReplay").addEventListener("click",function(){if(timeline)timeline.replay();});
Array.prototype.forEach.call(document.querySelectorAll(".rate"),function(b){
 b.addEventListener("click",function(){
  if(timeline)timeline.setDemoRate(parseFloat(b.getAttribute("data-rate")));
  Array.prototype.forEach.call(document.querySelectorAll(".rate"),function(x){x.classList.remove("on");});
  b.classList.add("on");
 });
});
document.addEventListener("visibilitychange",function(){if(document.hidden&&timeline&&playing){timeline.pause();}});
resample(true);
</script>
</body>
</html>
