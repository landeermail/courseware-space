<style>[data-control],[data-replay],button,select,input{min-height:44px}</style><script>
"use strict";

globalThis.CoursewarePrimitives = Object.freeze({
  createTimeline(options) {
    const duration = Number(options.durationPhysicalS);
    const onChange = options.onChange;
    if (!Number.isFinite(duration) || duration <= 0 || typeof onChange !== "function") {
      throw new Error("invalid timeline options");
    }
    let physicalTime = 0;
    let demoRate = 0.5;
    let playing = false;
    let frame = 0;
    let previous = 0;
    const emit = () => {
      if (typeof document !== "undefined" && document.documentElement) {
        document.documentElement.setAttribute("data-harness-physical-time", physicalTime.toFixed(6));
        document.documentElement.setAttribute("data-harness-playing", playing ? "true" : "false");
      }
      onChange(Object.freeze({ physicalTimeS: physicalTime, demoRate, playing }));
    };
    const tick = now => {
      if (!playing) return;
      if (!previous) previous = now;
      physicalTime = Math.min(duration, physicalTime + ((now - previous) / 1000) * demoRate);
      previous = now;
      emit();
      if (physicalTime >= duration) {
        playing = false;
        emit();
        return;
      }
      frame = requestAnimationFrame(tick);
    };
    return Object.freeze({
      play() {
        if (playing || physicalTime >= duration) return;
        playing = true;
        previous = 0;
        emit();
        frame = requestAnimationFrame(tick);
      },
      pause() {
        playing = false;
        cancelAnimationFrame(frame);
        emit();
      },
      replay() {
        playing = false;
        cancelAnimationFrame(frame);
        physicalTime = 0;
        previous = 0;
        emit();
      },
      seek(value) {
        physicalTime = Math.max(0, Math.min(duration, Number(value)));
        emit();
      },
      setDemoRate(value) {
        const next = Number(value);
        if (!Number.isFinite(next) || next < 0.1 || next > 4) throw new Error("invalid demo rate");
        demoRate = next;
        emit();
      },
      snapshot() { return Object.freeze({ physicalTimeS: physicalTime, demoRate, playing }); },
    });
  },
  formatPhysicalTime(value) { return `${Number(value).toFixed(2)} s（物理时间）`; },
  formatDemoRate(value) { return `${Number(value).toFixed(2)}×（演示倍率）`; },
});

</script>
<script>
globalThis.coursewareModel=Object.freeze({sample(input){const sc=(input&&input.scenario)||{};const times=(input&&input.times_s)||[];const num=(v,d)=>{const n=Number(v);return Number.isFinite(n)?n:d;};const g=num(sc.g_m_s2,9.8);const m=num(sc.mass_kg,1);const v0=num(sc.speed_m_s,0);const x0=num(sc.x0_m,0);const y0=num(sc.y0_m,0);const mode=sc.mode==='horizontal'?'horizontal':'oblique';const deg=mode==='horizontal'?0:num(sc.angle_deg,0);const th=deg*Math.PI/180;const vx0=v0*Math.cos(th);const vy0=v0*Math.sin(th);const ax=0;const ay=-g;const disc=Math.max(0,vy0*vy0+2*g*y0);const tf=g>0?(vy0+Math.sqrt(disc))/g:0;const range=vx0*tf;const tA=vy0>0&&g>0?vy0/g:0;const hMax=y0+(g>0?Math.max(0,vy0*vy0/(2*g)):0);const opt=g>0?Math.atan2(v0,Math.sqrt(Math.max(0,v0*v0+2*g*y0)))*180/Math.PI:(v0>0?45:0);const z=n=>Object.is(n,-0)?0:n;const states=times.map(t0=>{let t=num(t0,0);if(t<0)t=0;if(tf>0&&t>tf)t=tf;const x=x0+vx0*t;const y=Math.max(0,y0+vy0*t-0.5*g*t*t);const vx=vx0;const vy=vy0-g*t;const ke=0.5*m*(vx*vx+vy*vy);const pe=m*g*y;const me=ke+pe;return{t_s:z(t),x_m:z(x),y_m:z(y),vx_m_s:z(vx),vy_m_s:z(vy),ax_m_s2:z(ax),ay_m_s2:z(ay),kinetic_j:z(ke),potential_j:z(pe),mechanical_j:z(me)};});return{states:states,events:{flight_time_s:z(tf),range_m:z(range),apex_time_s:z(tA),max_height_m:z(hMax),optimal_equal_height_angle_deg:z(opt)}};}});
</script>
<script>globalThis.__HARNESS_INPUT__=Object.freeze({"scenario":{"mode":"oblique","g_m_s2":10.0,"mass_kg":1.2,"x0_m":5.0,"y0_m":0.0,"speed_m_s":22.0,"angle_deg":37.0},"times_s":[0.0,0.33099826273362654,0.6619965254672531,0.9929947882008796,1.3239930509345061,1.6549913136681327,1.9859895764017592,2.3169878391353858,2.6479861018690123]});</script><script>
(()=>{
  const root=document.documentElement;
  const short=value=>String(value&&value.message||value||'unknown runtime error').slice(0,500);
  addEventListener('error',event=>root.setAttribute('data-harness-runtime-error',short(event.error||event.message)),true);
  addEventListener('unhandledrejection',event=>root.setAttribute('data-harness-runtime-error',short(event.reason)),true);
  const expected=globalThis.__HARNESS_INPUT__.scenario;
  const original=globalThis.coursewareModel;
  let calls=0;
  const same=(left,right)=>{
    if(left===right)return true;
    if(!left||!right||typeof left!=='object'||typeof right!=='object')return false;
    const leftKeys=Object.keys(left).sort(),rightKeys=Object.keys(right).sort();
    return leftKeys.length===rightKeys.length&&leftKeys.every((key,index)=>key===rightKeys[index]&&same(left[key],right[key]));
  };
  const guarded=Object.freeze({sample(input){
    calls+=1;
    root.setAttribute('data-harness-sample-count',String(calls));
    if(calls===1){
      const matched=Boolean(input&&same(input.scenario,expected));
      root.setAttribute('data-harness-initial-scenario',matched?'matched':'mismatched');
      if(!matched)throw new Error('首次采样场景与老师确认题设不一致');
    }
    return original.sample(input);
  }});
  Object.defineProperty(globalThis,'coursewareModel',{value:guarded,writable:false,configurable:false});
})();
</script>

<body>
<main>
<h1>斜抛运动：上升与下降的速度、能量比较</h1>
<div class='grid'>

<marker id='arrR' viewBox='0 0 10 10' refX='8' refY='5' markerWidth='6' markerHeight='6' orient='auto-start-reverse'><path d='M 0 0 L 10 5 L 0 10 z' fill='#ef4444'></path></marker></defs>

<script>
(function(){
'use strict';
var P=CoursewarePrimitives,M=coursewareModel,H=globalThis.__HARNESS_INPUT__||{};
var DURATION=6,N=241,times=[],i;
for(i=0;i<N;i++){times.push(i*DURATION/(N-1));}
var base=(H&&H.scenario)?H.scenario:{angle_deg:37,g_m_s2:10,mass_kg:1.2,mode:'oblique',speed_m_s:22,x0_m:5,y0_m:0};
var scn={mode:'oblique',speed_m_s:num(base.speed_m_s,22),angle_deg:num(base.angle_deg,37),mass_kg:num(base.mass_kg,1.2),g_m_s2:num(base.g_m_s2,10),x0_m:num(base.x0_m,5),y0_m:num(base.y0_m,0)};
var data=M.sample({scenario:scn,times_s:times});
var curT=0,rate=1,playing=false,maxMech=1,sx=8,sy=8,groundY=372,leftX=44;
var $=function(s){return document.querySelector(s);};
var svg=$('#svg'),world=$('#world'),overlay=$('#overlay'),read=$('#readout');
var speed=$('#speed'),angle=$('#angle'),height=$('#height'),rateSel=$('#rate'),seek=$('#seek');
function num(v,d){v=parseFloat(v);return isFinite(v)?v:d;}
function clamp(v,a,b){return v<a?a:(v>b?b:v);}
function fmt(v,u){return (isFinite(v)?v:0).toFixed(2)+u;}
function stateAt(t){
 var s=data.states;if(!s||!s.length){return null;}
 if(t<=s[0].t_s){return s[0];}
 if(t>=s[s.length-1].t_s){return s[s.length-1];}
 var lo=0,hi=s.length-1,mid;
 while(hi-lo>1){mid=(lo+hi)>>1;if(s[mid].t_s<=t){lo=mid;}else{hi=mid;}}
 var a=s[lo],b=s[hi],w=(t-a.t_s)/((b.t_s-a.t_s)||1e-9),o={t_s:t};
 var keys=['x_m','y_m','vx_m_s','vy_m_s','ax_m_s2','ay_m_s2','kinetic_j','potential_j','mechanical_j'];
 for(var k=0;k<keys.length;k++){var key=keys[k];o[key]=a[key]+(b[key]-a[key])*w;}
 return o;
}
function X(x){return leftX+(x-scn.x0_m)*sx;}
function Y(y){return groundY-y*sy;}
function rebuild(){
 scn={mode:'oblique',speed_m_s:num(speed.value,22),angle_deg:num(angle.value,37),mass_kg:num(base.mass_kg,1.2),g_m_s2:num(base.g_m_s2,10),x0_m:num(base.x0_m,5),y0_m:num(height.value,0)};
 data=M.sample({scenario:scn,times_s:times});
 maxMech=1;for(i=0;i<data.states.length;i++){maxMech=Math.max(maxMech,data.states[i].mechanical_j,data.states[i].kinetic_j,data.states[i].potential_j);}
 var ev=data.events||{};var maxX=Math.max(30,(ev.range_m||30)+scn.x0_m+8);var maxY=Math.max(8,(ev.max_height_m||8)+scn.y0_m+4);
 sx=(800-leftX)/maxX;sy=(groundY-28)/maxY;
 $('#vVal').textContent=fmt(scn.speed_m_s,' m/s');$('#aVal').textContent=fmt(scn.angle_deg,'°');$('#hVal').textContent=fmt(scn.y0_m,' m');$('#rVal').textContent=rateSel.options[rateSel.selectedIndex].text;
 drawStatic();render(curT);
}
function drawStatic(){
 var s=data.states,ev=data.events||{},path='',pts='',j;
 for(j=0;j<s.length;j++){var p=s[j];path+=(j?' L':'M')+X(p.x_m).toFixed(1)+' '+Y(p.y_m).toFixed(1);if(j%12===0){pts+='<circle cx='+X(p.x_m).toFixed(1)+' cy='+Y(p.y_m).toFixed(1)+' r=2 fill=#64748b></circle>';}}
 var apex=stateAt(ev.apex_time_s||0),land=stateAt(ev.flight_time_s||0);
 world.innerHTML='<line x1=0 y1='+groundY+' x2=820 y2='+groundY+' stroke=#94a3b8 stroke-width=2></line>'+
 '<line x1='+leftX+' y1=24 x2='+leftX+' y2='+groundY+' stroke=#475569></line>'+
 '<text x=410 y=404 fill=#cbd5e1 text-anchor=middle font-size=14>水平位移 x</text>'+
 '<text x=18 y=210 fill=#cbd5e1 font-size=14 transform=rotate(-90 18 210)>高度 y</text>'+
 '<path d='+path+' fill=none stroke=#38bdf8 stroke-width=3></path>'+pts+
 (apex?'<circle cx='+X(apex.x_m)+' cy='+Y(apex.y_m)+' r=7 fill=#fde68a></circle><text x='+(X(apex.x_m)+10)+' y='+(Y(apex.y_m)-10)+' fill=#fde68a font-size=13>顶点</text>':'')+
 (land?'<circle cx='+X(land.x_m)+' cy='+Y(land.y_m)+' r=7 fill=#f87171></circle><text x='+(X(land.x_m)-52)+' y='+(Y(land.y_m)-12)+' fill=#fecaca font-size=13>落点</text>':'')+
 '<circle cx='+X(scn.x0_m)+' cy='+Y(scn.y0_m)+' r=6 fill=#a7f3d0></circle><text x='+(X(scn.x0_m)+8)+' y='+(Y(scn.y0_m)+18)+' fill=#a7f3d0 font-size=13>抛出点</text>';
}
function vector(x,y,vx,vy,scale,color,label){
 var ex=x+vx*scale,ey=y-vy*scale;
 return '<line x1='+x.toFixed(1)+' y1='+y.toFixed(1)+' x2='+ex.toFixed(1)+' y2='+ey.toFixed(1)+' stroke='+color+' stroke-width=3 marker-end=url(#arr)'+(color==='#ef4444'?'':'')+'></line><text x='+(ex+5).toFixed(1)+' y='+(ey-5).toFixed(1)+' fill='+color+' font-size=12>'+label+'</text>';
}
function render(t){
 curT=clamp(t,0,DURATION);var st=stateAt(curT),ev=data.events||{};if(!st){return;}
 var cx=X(st.x_m),cy=Y(st.y_m);var landed=st.y_m<=0.001&&curT>(ev.flight_time_s||999);
 var vscale=4.2,ascale=8;
 overlay.innerHTML='<circle cx='+cx.toFixed(1)+' cy='+cy.toFixed(1)+' r=10 fill=#fbbf24 stroke=#fff7ed stroke-width=2></circle>'+
 vector(cx,cy,st.vx_m_s,st.vy_m_s,vscale,'#f8fafc','v')+
 vector(cx,cy,0,st.vy_m_s,vscale,'#60a5fa','vy')+
 vector(cx,cy,st.vx_m_s,0,vscale,'#34d399','vx')+
 vector(cx,cy,st.ax_m_s2,st.ay_m_s2,ascale,'#ef4444','a')+
 '<text x=650 y=34 fill=#fde68a font-size=15>'+(landed?'已落地':(st.vy_m_s>=0?'上升阶段':'下降阶段'))+'</text>';
 $('#pt').textContent=P.formatPhysicalTime(curT);$('#dt').textContent=P.formatDemoRate(rate);seek.value=curT;
 $('#kBar').style.width=(100*st.kinetic_j/maxMech).toFixed(1)+'%';$('#pBar').style.width=(100*st.potential_j/maxMech).toFixed(1)+'%';$('#mBar').style.width=(100*st.mechanical_j/maxMech).toFixed(1)+'%';
 var nearApex=Math.abs(curT-(ev.apex_time_s||-99))<0.08;
 read.textContent='状态：'+(landed?'落地后样本保持 y=0':(st.vy_m_s>=0?'上升：竖直速度向上且被重力削减':'下降：竖直速度向下并增大'))+(nearApex?'｜正在顶点附近：vy 接近 0，vx 仍存在':'')+'\n'+
 't='+fmt(st.t_s,'s')+'  x='+fmt(st.x_m,'m')+'  y='+fmt(st.y_m,'m')+'\n'+
 'vx='+fmt(st.vx_m_s,'m/s')+'  vy='+fmt(st.vy_m_s,'m/s')+'  ax='+fmt(st.ax_m_s2,'m/s²')+'  ay='+fmt(st.ay_m_s2,'m/s²')+'\n'+
 '动能='+fmt(st.kinetic_j,'J')+'  势能='+fmt(st.potential_j,'J')+'  机械能='+fmt(st.mechanical_j,'J')+'\n'+
 '事件：顶点 '+P.formatPhysicalTime(ev.apex_time_s||0)+'，最大高度 '+fmt(ev.max_height_m,'m')+'；飞行 '+P.formatPhysicalTime(ev.flight_time_s||0)+'，射程 '+fmt(ev.range_m,'m')+'。';
}
var tl=P.createTimeline({durationPhysicalS:DURATION,onChange:function(st){curT=st.physicalTimeS;rate=st.demoRate;playing=st.playing;$('#playBtn').textContent=playing?'暂停':'播放';render(curT);}});
tl.pause();
$('#playBtn').addEventListener('click',function(){if(playing){tl.pause();}else{tl.play();}});
$('#pauseBtn').addEventListener('click',function(){tl.pause();});
$('#replayBtn').addEventListener('click',function(){tl.replay();});
rateSel.addEventListener('change',function(){tl.setDemoRate(clamp(parseFloat(rateSel.value)||1,0.1,4));});
seek.addEventListener('input',function(){tl.pause();tl.seek(clamp(parseFloat(seek.value)||0,0,DURATION));});
[speed,angle,height].forEach(function(el){el.addEventListener('input',function(){rebuild();tl.seek(clamp(curT,0,DURATION));});});
svg.addEventListener('pointerdown',function(e){var r=svg.getBoundingClientRect(),fx=(e.clientX-r.left)/r.width*820;var guess=clamp((fx-leftX)/(820-leftX),0,1)*DURATION;tl.pause();tl.seek(guess);});
document.addEventListener('visibilitychange',function(){if(document.hidden){tl.pause();}});
speed.value=scn.speed_m_s;angle.value=scn.angle_deg;height.value=scn.y0_m;rebuild();tl.setDemoRate(1);tl.seek(0);
})();
</script>
