ackground:#f59e0b}.bar.me i{background:#a78bfa}@media(max-width:760px){.wrap{grid-template-columns:1fr;padding:10px}header{padding:12px}.reads{grid-template-columns:1fr}}</style></head><body><header><h1>平抛与斜抛运动：水平位移与下落过程的独立性</h1><p>拖动初速度与高度，按播放观察：蓝色为真实抛出点，绿色竖直影子只复刻 y 方向，橙色水平影子只复刻 x 方向。</p></header><main class='wrap'><section class='panel' aria-label='控制面板'><label>初速度 v0：<output id='vVal'>15.0</output> m/s<input id='v' data-control type='range' min='5' max='30' step='0.5' value='15'></label><label>释放高度 h：<output id='hVal'>45</output> m<input id='h' data-control type='range' min='20' max='80' step='1' value='45'></label><div class='row'><button id='play'>播放</button><button id='replay' data-replay class='ghost'>回放</button><label class='rate'>演示倍率<input id='rate' data-control type='range' min='0.1' max='4' step='0.1' value='1'></label></div><div class='reads'><div>物理时间<br><b data-physical-time id='pt'>0.00 s</b></div><div>演示倍率<br><b data-demo-time id='dt'>×1.0</b></div></div><div data-readout id='readout' class='readout'>等待采样…</div><div class='hint' id='hint'></div><div style='margin-top:10px'><div>动能</div><div class='bar ke'><i id='ek'></i></div><div>势能</div><div class='bar pe'><i id='ep'></i></div><div>机械能</div><div class='bar me'><i id='em'></i></div></div></section><section class='stage'><svg id='svg' viewBox='0 0 640 420' role='img' aria-label='平抛运动图'><defs><marker id='arr' markerWidth='8' markerHeight='8' refX='7' refY='3' orient='auto'><path d='M0 0L8 3L0 6Z' fill='#f8fafc'></path></marker></defs><rect x='0' y='0' width='640' height='420' fill='transparent'></rect><line id='ground' x1='24' y1='390' x2='616' y2='390' stroke='#64748b' stroke-width='3'></line><path id='traj' fill='none' stroke='#38bdf8' stroke-width='3'></path><line id='vx' stroke='#fb923c' stroke-width='3' marker-end='url(#arr)'></line><line id='vy' stroke='#34d399' stroke-width='3' marker-end='url(#arr)'></line><line id='acc' stroke='#f43f5e' stroke-width='3' marker-end='url(#arr)'></line><circle id='href' r='7' fill='#fb923c' opacity='.85'></circle><circle id='vref' r='7' fill='#34d399' opacity='.85'></circle><circle id='ball' r='9' fill='#60a5fa' stroke='#e0f2fe' stroke-width='2'></circle><text id='tacc' x='0' y='0' fill='#fecdd3' font-size='13'>g 向下</text><text id='tvx' x='0' y='0' fill='#fdba74' font-size='13'>vx</text><text id='tvy' x='0' y='0' fill='#86efac' font-size='13'>vy</text><text id='start' x='34' y='42' fill='#cbd5e1' font-size='13'>抛出点</text></svg><div class='legend'><span>蓝点：合成运动</span><span>橙点/橙箭：水平分量</span><span>绿点/绿箭：竖直分量</span><span>红箭：重力加速度</span></div></section></main><style>[data-control],[data-replay],button,select,input{min-height:44px}</style><script>
"use strict";

globalThis.CoursewarePrimitives = Object.freeze({
  createTimeline(options) {
    const duration = Number(options.durationPhysicalS);
    const onChange = options.onChange;
    if (!Number.isFinite(duration) || duration <= 0 || typeof onChange !== "function") {
      throw new Error("invalid timeline options");
    }
    let physicalTime = 0;
    let demoRate = 0.5;
    let playing = false;
    let frame = 0;
    let previous = 0;
    const emit = () => onChange(Object.freeze({ physicalTimeS: physicalTime, demoRate, playing }));
    const tick = now => {
      if (!playing) return;
      if (!previous) previous = now;
      physicalTime = Math.min(duration, physicalTime + ((now - previous) / 1000) * demoRate);
      previous = now;
      emit();
      if (physicalTime >= duration) {
        playing = false;
        emit();
        return;
      }
      frame = requestAnimationFrame(tick);
    };
    return Object.freeze({
      play() {
        if (playing || physicalTime >= duration) return;
        playing = true;
        previous = 0;
        emit();
        frame = requestAnimationFrame(tick);
      },
      pause() {
        playing = false;
        cancelAnimationFrame(frame);
        emit();
      },
      replay() {
        playing = false;
        cancelAnimationFrame(frame);
        physicalTime = 0;
        previous = 0;
        emit();
      },
      seek(value) {
        physicalTime = Math.max(0, Math.min(duration, Number(value)));
        emit();
      },
      setDemoRate(value) {
        const next = Number(value);
        if (!Number.isFinite(next) || next < 0.1 || next > 4) throw new Error("invalid demo rate");
        demoRate = next;
        emit();
      },
      snapshot() { return Object.freeze({ physicalTimeS: physicalTime, demoRate, playing }); },
    });
  },
  formatPhysicalTime(value) { return `${Number(value).toFixed(2)} s（物理时间）`; },
  formatDemoRate(value) { return `${Number(value).toFixed(2)}×（演示倍率）`; },
});

<script>
globalThis.coursewareModel=Object.freeze({sample(input){var s=(input&&input.scenario)||{};var times=(input&&input.times_s)||[];var g=Number(s.g_m_s2);if(!(g>0)){g=9.8;}var m=Number(s.mass_kg);if(!(m>0)){m=1;}var v0=Number(s.speed_m_s);if(!(v0>=0)){v0=0;}var angDeg=Number(s.angle_deg);if(!isFinite(angDeg)){angDeg=0;}if(s.mode==='horizontal'){angDeg=0;}var x0=Number(s.x0_m);if(!isFinite(x0)){x0=0;}var y0=Number(s.y0_m);if(!(y0>=0)){y0=0;}var rad=angDeg*Math.PI/180;var vx0=v0*Math.cos(rad);var vy0=v0*Math.sin(rad);var disc=vy0*vy0+2*g*y0;var tf=(vy0+Math.sqrt(disc))/g;if(!(tf>=0)){tf=0;}var range=vx0*tf;var apexT=vy0>0?vy0/g:0;var maxH=vy0>0?y0+vy0*vy0/(2*g):y0;var states=[];for(var i=0;i<times.length;i++){var t=Number(times[i]);if(!isFinite(t)||t<0){t=0;}var te=t>tf?tf:t;var x=x0+vx0*te;var y=y0+vy0*te-0.5*g*te*te;if(y<0){y=0;}var vx=vx0;var vy=vy0-g*te;var ke=0.5*m*(vx*vx+vy*vy);var pe=m*g*y;states.push({t_s:t,x_m:x,y_m:y,vx_m_s:vx,vy_m_s:vy,ax_m_s2:0,ay_m_s2:-g,kinetic_j:ke,potential_j:pe,mechanical_j:ke+pe});}return{states:states,events:{flight_time_s:tf,range_m:range,apex_time_s:apexT,max_height_m:maxH,optimal_equal_height_angle_deg:45}};}});
</script>

<script>const $=id=>document.getElementById(id);const NS='http://www.w3.org/2000/svg';const raw=globalThis.__HARNESS_INPUT__||{};const base=(raw.scenario||raw||{angle_deg:0,g_m_s2:10,mass_kg:.2,mode:'horizontal',speed_m_s:15,x0_m:2,y0_m:45});let states=[],events={},tl=null,last={physicalTimeS:0,demoRate:1,playing:false};const C=globalThis.CoursewarePrimitives,M=globalThis.coursewareModel;function el(n,a){const e=document.createElementNS(NS,n);for(const k in a)e.setAttribute(k,a[k]);return e}function axis(){const a=[];for(let i=0;i<=240;i++)a.push(+(i*.05).toFixed(3));return a}function scenario(){const s=Object.assign({},base);s.mode='horizontal';s.angle_deg=0;s.speed_m_s=+$('v').value;s.y0_m=+$('h').value;s.x0_m=+(base.x0_m==null?2:base.x0_m);return s}function fmt(n){return (Math.round(n*100)/100).toFixed(2)}function nearest(t){if(!states.length)return null;let i=Math.round(t/.05);if(i<0)i=0;if(i>=states.length)i=states.length-1;return states[i]}function mapXY(){const sc=scenario();const mx=Math.max(12,(events.range_m||0),sc.x0_m)*1.12,my=Math.max(12,(events.max_height_m||0),sc.y0_m)*1.12;return{x:v=>30+v/mx*560,y:v=>390-v/my*330,mx,my,sc}}function staticDraw(){const m=mapXY();let d='';states.forEach((s,i)=>{if(s.t_s>(events.flight_time_s||1e9)+.001)return;d+=(i?'L':'M')+m.x(s.x_m).toFixed(1)+' '+m.y(s.y_m).toFixed(1)});$('traj').setAttribute('d',d);$('start').setAttribute('x',m.x(m.sc.x0_m)-18);$('start').setAttribute('y',m.y(m.sc.y0_m)-14);$('hint').textContent='本次采样：飞行时间 '+fmt(events.flight_time_s||0)+' s，射程 '+fmt(events.range_m||0)+' m。只调 v0 时对照飞行时间是否几乎不变；只调 h 时观察时间与射程一起变。'}function render(st){last=st;$('pt').textContent=C.formatPhysicalTime(st.physicalTimeS);$('dt').textContent=C.formatDemoRate(st.demoRate);const s=nearest(st.physicalTimeS);if(!s)return;const m=mapXY(),x=m.x(s.x_m),y=m.y(s.y_m),x0=m.x(m.sc.x0_m),y0=m.y(m.sc.y0_m);$('ball').setAttribute('cx',x);$('ball').setAttribute('cy',y);$('vref').setAttribute('cx',x0);$('vref').setAttribute('cy',y);$('href').setAttribute('cx',x);$('href').setAttribute('cy',y0);const sp=Math.max(1,m.sc.speed_m_s),k=54/sp,vx=Math.max(-90,Math.min(90,s.vx_m_s*k)),vy=Math.max(-90,Math.min(90,-s.vy_m_s*k));$('vx').setAttribute('x1',x);$('vx').setAttribute('y1',y);$('vx').setAttribute('x2',x+vx);$('vx').setAttribute('y2',y);$('vy').setAttribute('x1',x);$('vy').setAttribute('y1',y);$('vy').setAttribute('x2',x);$('vy').setAttribute('y2',y+vy);$('acc').setAttribute('x1',x);$('acc').setAttribute('y1',y);$('acc').setAttribute('x2',x);$('acc').setAttribute('y2',y+58);[['tvx',x+vx+8,y-6],['tvy',x+10,y+vy],['tacc',x+10,y+66]].forEach(a=>{$(a[0]).setAttribute('x',a[1]);$(a[0]).setAttribute('y',a[2])});const den=Math.max(.001,s.mechanical_j||0);$('ek').style.width=Math.min(100,100*s.kinetic_j/den)+'%';$('ep').style.width=Math.min(100,100*s.potential_j/den)+'%';$('em').style.width=Math.min(100,100*s.mechanical_j/den)+'%';$('readout').textContent='t='+fmt(s.t_s)+' s  x='+fmt(s.x_m)+' m  y='+fmt(s.y_m)+' m
vx='+fmt(s.vx_m_s)+' m/s  vy='+fmt(s.vy_m_s)+' m/s  ax='+fmt(s.ax_m_s2)+'  ay='+fmt(s.ay_m_s2)+' m/s²
Ek='+fmt(s.kinetic_j)+' J  Ep='+fmt(s.potential_j)+' J  E='+fmt(s.mechanical_j)+' J';$('play').textContent=st.playing?'暂停':'播放'}function rebuild(){const dur=Math.max(.2,+(events.flight_time_s||1));if(tl&&tl.pause)tl.pause();tl=C.createTimeline({durationPhysicalS:dur,onChange:render});tl.setDemoRate(+$('rate').value);tl.seek(0);render({physicalTimeS:0,demoRate:+$('rate').value,playing:false})}function resample(){$('vVal').textContent=(+$('v').value).toFixed(1);$('hVal').textContent=(+$('h').value).toFixed(0);const out=M.sample({scenario:scenario(),times_s:axis()});states=out.states||[];events=out.events||{};staticDraw();rebuild()}['v','h'].forEach(id=>$(id).addEventListener('input',resample));$('rate').addEventListener('input',()=>{if(tl)tl.setDemoRate(+$('rate').value);$('dt').textContent=C.formatDemoRate(+$('rate').value)});$('play').addEventListener('click',()=>{if(!tl)return;if(last.playing){tl.pause()}else{tl.play()}});$('replay').addEventListener('click',()=>{if(tl)tl.replay()});document.addEventListener('visibilitychange',()=>{if(document.hidden&&tl)tl.pause()});resample();</script></body></html>
