<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex,nofollow,noarchive">
  <link rel="icon" href="data:,">
  <title>{{TITLE}}</title>
  <style>
    :root{--ink:#172033;--muted:#667085;--line:#d8e0ea;--blue:#2459d3;--soft:#f4f7fb;--warn:#8a4b08;--warn-bg:#fff6e8}
    *{box-sizing:border-box}body{margin:0;color:var(--ink);background:#eef3f8;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;line-height:1.75}
    main{width:min(920px,calc(100% - 28px));margin:28px auto 56px;padding:clamp(20px,4vw,42px);border:1px solid var(--line);border-radius:20px;background:#fff;box-shadow:0 18px 50px rgba(23,32,51,.08)}
    .private{margin:0 0 24px;padding:10px 14px;border-left:4px solid #d97706;color:var(--warn);background:var(--warn-bg);font-size:14px;font-weight:700}
    .number{margin:0;color:var(--blue);font-size:14px;font-weight:800;letter-spacing:.08em}h1{margin:4px 0 20px;font-size:clamp(26px,4vw,38px);line-height:1.25}
    .question{font-family:Georgia,"Times New Roman","Songti SC",SimSun,serif;font-size:clamp(17px,2.4vw,21px)}.question p{margin:0 0 14px}.question ol{padding-left:1.7em}.question li{margin:8px 0}
    .formula{white-space:nowrap;font-family:Georgia,"Times New Roman",serif}.diagram{display:block;width:min(100%,780px);max-height:520px;object-fit:contain;margin:24px auto;border-radius:12px;background:var(--soft)}
    .prompt{margin-top:28px;padding:18px;border:1px solid #b9c8ef;border-radius:14px;background:#f1f5ff}.prompt strong{display:block;margin-bottom:5px;color:var(--blue)}
    footer{margin-top:26px;padding-top:16px;border-top:1px solid var(--line);color:var(--muted);font-size:13px}
    @media(max-width:480px){main{width:min(100% - 16px,420px);margin:8px auto 28px;padding:18px 14px;border-radius:14px}.question{font-size:17px}.diagram{margin:18px auto}}
    @media print{body{background:#fff}main{width:100%;margin:0;padding:0;border:0;box-shadow:none}.private{border:1px solid #d97706}}
  </style>
</head>
<body>
  <main>
    <p class="private">内部试用材料 · 不公开发布 · 不含答案与解析</p>
    <p class="number">{{NUMBER}}</p>
    <h1>{{TITLE}}</h1>
    <section class="question">{{CONTENT}}</section>
    <img class="diagram" src="{{IMAGE_SOURCE}}" alt="{{IMAGE_ALT}}">
    <aside class="prompt"><strong>本题只讨论一个问题</strong>这道题的好课件，必须让学生看到什么、做到什么？</aside>
    <footer>{{SOURCE_LABEL}}</footer>
  </main>
</body>
</html>
