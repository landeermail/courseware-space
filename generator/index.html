<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>物理互动课件生成器</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Ctext y='.9em' font-size='56'%3E🪄%3C/text%3E%3C/svg%3E">
  <style>
    :root {
      --ink: #172033;
      --muted: #667085;
      --line: #d8dfeb;
      --surface: #ffffff;
      --soft: #f3f6fb;
      --blue: #2563eb;
      --blue-dark: #1d4ed8;
      --blue-soft: #eaf1ff;
      --green: #047857;
      --green-soft: #ecfdf5;
      --amber: #9a4d00;
      --amber-soft: #fff7e6;
      --red: #b42318;
      --shadow: 0 14px 38px rgba(31, 45, 75, .10);
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      color: var(--ink);
      background:
        radial-gradient(circle at 15% -10%, #dbeafe 0, transparent 34%),
        linear-gradient(180deg, #f8fbff 0, #f4f6fa 100%);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
      line-height: 1.6;
    }

    button, textarea, input { font: inherit; }
    button, a { -webkit-tap-highlight-color: transparent; }
    button:focus-visible, textarea:focus-visible, input:focus-visible, a:focus-visible {
      outline: 3px solid rgba(37, 99, 235, .28);
      outline-offset: 2px;
    }

    .page {
      width: min(1060px, calc(100% - 32px));
      margin: 0 auto;
      padding: 24px 0 56px;
    }

    .topbar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 16px;
      margin-bottom: 44px;
    }

    .brand { color: #24324d; font-weight: 800; }
    .back { color: #344054; text-decoration: none; font-weight: 700; }

    .hero {
      max-width: 760px;
      margin: 0 auto 24px;
      text-align: center;
    }

    .eyebrow {
      display: inline-block;
      margin-bottom: 10px;
      padding: 5px 10px;
      border-radius: 999px;
      color: #1d4ed8;
      background: #e8f0ff;
      font-size: 13px;
      font-weight: 800;
    }

    h1 {
      margin: 0;
      font-size: clamp(30px, 5vw, 48px);
      line-height: 1.16;
      letter-spacing: -.03em;
    }

    .hero p {
      max-width: 680px;
      margin: 14px auto 0;
      color: var(--muted);
      font-size: 17px;
    }

    .scope {
      display: flex;
      justify-content: center;
      gap: 8px;
      flex-wrap: wrap;
      margin-top: 18px;
    }

    .scope span {
      padding: 5px 9px;
      border: 1px solid #cdd8ec;
      border-radius: 8px;
      color: #344054;
      background: rgba(255,255,255,.68);
      font-size: 13px;
      font-weight: 700;
    }

    .panel {
      border: 1px solid var(--line);
      border-radius: 20px;
      background: var(--surface);
      box-shadow: var(--shadow);
    }

    .composer { max-width: 820px; margin: 0 auto; padding: 22px; }

    label {
      display: block;
      margin-bottom: 8px;
      color: #344054;
      font-weight: 800;
    }

    textarea, input {
      width: 100%;
      border: 1px solid #bfc9da;
      border-radius: 12px;
      color: var(--ink);
      background: #fff;
    }

    textarea {
      min-height: 168px;
      padding: 14px 15px;
      resize: vertical;
      line-height: 1.65;
    }

    input { min-height: 46px; padding: 10px 12px; }

    .composer-foot {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin-top: 14px;
    }

    .hint { margin: 0; color: var(--muted); font-size: 13px; }

    button, .button-link {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-height: 48px;
      padding: 10px 18px;
      border: 1px solid #c7d0df;
      border-radius: 12px;
      color: #344054;
      background: #fff;
      cursor: pointer;
      font-weight: 800;
      text-decoration: none;
    }

    button:hover, .button-link:hover { background: #f8fafc; }
    button:disabled { cursor: wait; opacity: .65; }

    .primary {
      min-width: 190px;
      border-color: var(--blue);
      color: #fff;
      background: var(--blue);
    }

    .primary:hover { background: var(--blue-dark); }
    .secondary-small { min-height: 44px; padding: 7px 12px; font-size: 13px; }

    .status-panel, .result-panel, .manual-panel {
      max-width: 920px;
      margin: 20px auto 0;
      padding: 22px;
    }

    [hidden] { display: none !important; }

    .status-head {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 18px;
    }

    .spinner {
      width: 26px;
      height: 26px;
      border: 3px solid #cbd8ef;
      border-top-color: var(--blue);
      border-radius: 50%;
      animation: spin .9s linear infinite;
    }

    @keyframes spin { to { transform: rotate(360deg); } }

    .status-head strong { display: block; }
    .status-head span { color: var(--muted); font-size: 13px; }

    .steps {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 8px;
    }

    .step {
      padding: 11px;
      border-radius: 10px;
      color: var(--muted);
      background: var(--soft);
      font-size: 13px;
      font-weight: 700;
    }

    .step.active { color: #1d4ed8; background: var(--blue-soft); }
    .step.done { color: var(--green); background: var(--green-soft); }

    .result-head {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      margin-bottom: 14px;
    }

    .result-head h2, .manual-panel h2 { margin: 0; font-size: 22px; }
    .result-head p, .manual-panel > p { margin: 4px 0 0; color: var(--muted); }

    .preview {
      width: 100%;
      min-height: 640px;
      border: 1px solid var(--line);
      border-radius: 14px;
      background: var(--soft);
    }

    .manual-panel {
      border-color: #ead3a8;
      background: #fffdf8;
    }

    .manual-reason {
      margin: 14px 0;
      padding: 10px 12px;
      border-radius: 10px;
      color: var(--amber);
      background: var(--amber-soft);
      font-size: 14px;
    }

    .manual-form {
      display: grid;
      grid-template-columns: 1fr 1.35fr;
      gap: 13px;
    }

    .manual-form .wide { grid-column: 1 / -1; }
    .manual-form textarea { min-height: 92px; }

    .feedback {
      margin-top: 12px;
      color: var(--green);
      font-weight: 800;
    }

    .error { color: var(--red); }

    @media (max-width: 680px) {
      .page { width: min(100% - 20px, 1060px); padding-top: 14px; }
      .topbar { margin-bottom: 28px; }
      .brand { font-size: 14px; }
      .back { font-size: 14px; }
      .hero { text-align: left; }
      .hero p { font-size: 15px; }
      .scope { justify-content: flex-start; }
      .composer, .status-panel, .result-panel, .manual-panel { padding: 16px; }
      .composer-foot { align-items: stretch; flex-direction: column; }
      .primary { width: 100%; }
      .steps { grid-template-columns: 1fr; }
      .result-head { align-items: stretch; flex-direction: column; }
      .button-link { width: 100%; }
      .preview { min-height: 560px; }
      .manual-form { grid-template-columns: 1fr; }
      .manual-form .wide { grid-column: auto; }
    }

    @media (prefers-reduced-motion: reduce) {
      .spinner { animation-duration: 1.8s; }
    }
  </style>
</head>
<body>
  <main class="page">
    <nav class="topbar" aria-label="页面导航">
      <span class="brand">物理互动课件库</span>
      <a class="back" href="../">返回课件首页</a>
    </nav>

    <header class="hero">
      <span class="eyebrow">老师课件生成器</span>
      <h1>把一道题，变成可操作的物理模型</h1>
      <p>粘贴题目后，系统会识别参数、校验物理关系并生成可直接讲解的互动课件。</p>
      <div class="scope" aria-label="当前支持范围">
        <span>匀强磁场</span><span>闭合平行导轨</span><span>导体杆匀速平动</span><span>定值总电阻</span>
      </div>
    </header>

    <form class="panel composer" id="generateForm">
      <label for="question">输入物理题目</label>
      <textarea id="question" name="question" required minlength="12" maxlength="2000" placeholder="请粘贴包含 B、L、v、R 以及磁场和运动方向的完整题目……"></textarea>
      <div class="composer-foot">
        <div>
          <p class="hint">当前模板外的题目会自动进入人工处理，24 小时内交付。</p>
          <button class="secondary-small" id="exampleButton" type="button">填入一题试试</button>
        </div>
        <button class="primary" id="generateButton" type="submit">生成互动课件</button>
      </div>
    </form>

    <section class="panel status-panel" id="statusPanel" aria-live="polite" hidden>
      <div class="status-head">
        <span class="spinner" aria-hidden="true"></span>
        <div><strong id="statusTitle">正在识别题目</strong><span id="statusCopy">通常约一分钟，请保持页面打开。</span></div>
      </div>
      <div class="steps">
        <div class="step active" data-step="1">1　识别题型与参数</div>
        <div class="step" data-step="2">2　校验方向与公式</div>
        <div class="step" data-step="3">3　构建互动模型</div>
      </div>
    </section>

    <section class="panel result-panel" id="resultPanel" hidden>
      <div class="result-head">
        <div><h2>课件已经生成</h2><p>可以直接操作模型，也可以在新页面中打开讲解。</p></div>
        <a class="button-link" id="openResult" target="_blank" rel="noopener">在新页面打开</a>
      </div>
      <iframe class="preview" id="resultFrame" title="生成的互动课件预览"></iframe>
    </section>

    <section class="panel manual-panel" id="manualPanel" hidden>
      <h2>这道题将转由人工制作</h2>
      <p>当前自动模板还不能可靠覆盖它。留下联系方式后，我们将在 24 小时内交付。</p>
      <div class="manual-reason" id="manualReason"></div>
      <form class="manual-form" id="manualForm">
        <div><label for="teacherName">称呼</label><input id="teacherName" required maxlength="50" autocomplete="name"></div>
        <div><label for="teacherContact">联系方式</label><input id="teacherContact" required maxlength="120" placeholder="手机号、微信或邮箱" autocomplete="email"></div>
        <div class="wide"><label for="teacherNote">补充说明（选填）</label><textarea id="teacherNote" maxlength="500" placeholder="例如上课时间、希望重点呈现的过程"></textarea></div>
        <div class="wide"><button class="primary" id="manualSubmit" type="submit">提交人工制作</button><p class="feedback" id="manualFeedback" aria-live="polite"></p></div>
      </form>
    </section>
  </main>

  <script>
    (() => {
      'use strict';
      const $ = id => document.getElementById(id);
      const example = '两根平行光滑金属导轨间距为1.0 m，左端接0.40 Ω电阻形成闭合回路，其余电阻不计。整个装置处于垂直纸面向里的0.50 T匀强磁场中，导体杆以2.0 m/s向右做匀速直线运动。求感应电动势、电流方向和安培力大小。';
      let activeJobId = '';
      let pollTimer = 0;
      let pollCount = 0;

      function setVisible(id) {
        for (const panelId of ['statusPanel', 'resultPanel', 'manualPanel']) {
          $(panelId).hidden = panelId !== id;
        }
      }

      function updateSteps(status) {
        const active = status === 'queued' ? 1 : status === 'running' ? Math.min(3, 2 + Math.floor(pollCount / 4)) : 3;
        document.querySelectorAll('.step').forEach(step => {
          const number = Number(step.dataset.step);
          step.classList.toggle('done', number < active || status === 'succeeded');
          step.classList.toggle('active', number === active && status !== 'succeeded');
        });
        $('statusTitle').textContent = active === 1 ? '正在识别题目' : active === 2 ? '正在校验物理关系' : '正在构建互动模型';
      }

      async function requestJson(url, options = {}) {
        const response = await fetch(url, {
          ...options,
          headers: {'Content-Type': 'application/json', ...(options.headers || {})}
        });
        const payload = await response.json().catch(() => ({}));
        if (!response.ok) throw new Error(payload.error || `请求失败（${response.status}）`);
        return payload;
      }

      async function pollJob() {
        try {
          const {job} = await requestJson(`/api/jobs/${activeJobId}`);
          pollCount += 1;
          updateSteps(job.status);
          if (job.status === 'succeeded') {
            clearTimeout(pollTimer);
            $('generateButton').disabled = false;
            $('generateButton').textContent = '再生成一题';
            $('openResult').href = job.output_url;
            $('resultFrame').src = job.output_url;
            setVisible('resultPanel');
            return;
          }
          if (job.status === 'manual_required') {
            clearTimeout(pollTimer);
            $('generateButton').disabled = false;
            $('generateButton').textContent = '再试一题';
            $('manualReason').textContent = job.reason || '题目超出当前自动模板范围。';
            setVisible('manualPanel');
            return;
          }
          if (pollCount >= 120) throw new Error('生成时间超过预期，请稍后重试。');
          pollTimer = window.setTimeout(pollJob, 1000);
        } catch (error) {
          $('generateButton').disabled = false;
          $('generateButton').textContent = '重新生成';
          $('manualReason').textContent = error instanceof Error ? error.message : '生成服务暂时不可用。';
          setVisible('manualPanel');
        }
      }

      $('exampleButton').addEventListener('click', () => {
        $('question').value = example;
        $('question').focus();
      });

      $('generateForm').addEventListener('submit', async event => {
        event.preventDefault();
        clearTimeout(pollTimer);
        pollCount = 0;
        activeJobId = '';
        $('generateButton').disabled = true;
        $('generateButton').textContent = '正在生成…';
        $('resultFrame').removeAttribute('src');
        setVisible('statusPanel');
        updateSteps('queued');
        try {
          const {job} = await requestJson('/api/generate', {
            method: 'POST',
            body: JSON.stringify({question: $('question').value})
          });
          activeJobId = job.id;
          pollJob();
        } catch (error) {
          $('generateButton').disabled = false;
          $('generateButton').textContent = '重新生成';
          $('manualReason').textContent = error instanceof Error ? error.message : '生成服务暂时不可用。';
          setVisible('manualPanel');
        }
      });

      $('manualForm').addEventListener('submit', async event => {
        event.preventDefault();
        if (!activeJobId) {
          $('manualFeedback').textContent = '生成服务未连接，请稍后重试。';
          $('manualFeedback').classList.add('error');
          return;
        }
        $('manualSubmit').disabled = true;
        $('manualFeedback').textContent = '';
        try {
          const payload = await requestJson('/api/manual-requests', {
            method: 'POST',
            body: JSON.stringify({
              job_id: activeJobId,
              name: $('teacherName').value,
              contact: $('teacherContact').value,
              note: $('teacherNote').value
            })
          });
          $('manualFeedback').classList.remove('error');
          $('manualFeedback').textContent = `提交成功，${payload.delivery}。`;
        } catch (error) {
          $('manualFeedback').classList.add('error');
          $('manualFeedback').textContent = error instanceof Error ? error.message : '提交失败，请稍后重试。';
          $('manualSubmit').disabled = false;
        }
      });
    })();
  </script>
</body>
</html>
